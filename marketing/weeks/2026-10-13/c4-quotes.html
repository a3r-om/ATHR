<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كاروسيل: قلها بكوب</title>
<link rel="stylesheet" href="../../kit/brand.css">
<style>
.s1 .txt { position: absolute; top: 190px; right: 80px; left: 80px; z-index: 3; }
.s1 .h { font-size: 132px; }
.s1 .sub { margin-top: 16px; color: var(--deep); }
.s1 .swipe { margin-top: 28px; }
.q > .frame { position: absolute; top: 160px; right: 80px; left: 80px; height: 820px; }
.q .quote { position: absolute; top: 1020px; right: 80px; left: 80px; text-align: center; }
.q .quote b { display: block; font-size: 76px; font-weight: 700; color: var(--wine); line-height: 1.2; }
.q .quote span { display: block; margin-top: 16px; font-size: 38px; font-weight: 500; color: var(--muted); }
.two { position: absolute; top: 160px; right: 80px; left: 80px; height: 820px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.two .frame { height: 100%; }
.s5 .h { font-size: 92px; }
.s5 .sub { margin-top: 20px; }
.s5 .price { margin-top: 50px; }
.s5 .k { margin-top: 30px; }
</style>
</head>
<body>

<section class="slide s1">
    <img class="bg-photo" src="../../../images/categories/quotes.jpg" alt="">
    <img class="logo" src="../../kit/logo_burgundy.png" alt="روا"><span class="count">1/5</span>
    <div class="txt">
        <h1 class="h">قلها بكوب</h1>
        <p class="sub">عبارات تقول اللي في خاطرك</p>
        <span class="swipe">اسحب واختار عبارتك <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
    </div>
</section>

<section class="slide q">
    <img class="logo" src="../../kit/logo_burgundy.png" alt="روا"><span class="count">2/5</span>
    <div class="frame"><img src="../../../images/t/1sxsif1txeh-m.webp" alt="كوب نتقهوى عيونك أسود" style="object-position:50% 64%"></div>
    <div class="quote"><b>نتقهوى عيونك؟</b><span>للي تحب تشرب قهوتك معه</span></div>
</section>

<section class="slide q">
    <img class="logo" src="../../kit/logo_burgundy.png" alt="روا"><span class="count">3/5</span>
    <div class="frame"><img src="../../../images/t/1oofkq2orgy-m.webp" alt="كوب زارني والشوق أبيض" style="object-position:50% 66%"></div>
    <div class="quote"><b>زارني والشوق في عينه</b><span>لأحد غاب واشتقت له</span></div>
</section>

<section class="slide q">
    <img class="logo" src="../../kit/logo_burgundy.png" alt="روا"><span class="count">4/5</span>
    <div class="two">
        <div class="frame"><img src="../../../images/t/z56pmmhapz-m.webp" alt="كوب علميني ليه أبيض" style="object-position:50% 66%"></div>
        <div class="frame"><img src="../../../images/t/1w1dpwvjdvv-m.webp" alt="كوب علميني ليه أسود" style="object-position:50% 66%"></div>
    </div>
    <div class="quote"><b>علميني ليه أنا أسأل عليك؟</b><span>بالأبيض أو الأسود، على ذوقك</span></div>
</section>

<section class="slide s5">
    <span class="count">5/5</span>
    <div class="pad center">
        <img src="../../kit/logo_burgundy.png" alt="روا" style="width:240px;height:auto">
        <h2 class="h" style="margin-top:46px">لمن تهدي هالكوب؟</h2>
        <p class="sub">منشنه في التعليقات</p>
        <div class="price"><b>2.800 <small>ر.ع</small></b><s>3.500</s></div>
        <p class="k">الرابط في البايو</p>
    </div>
</section>

</body>
</html>
