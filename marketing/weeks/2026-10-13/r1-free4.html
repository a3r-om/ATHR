<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ريلز: 4 أكواب = التوصيل علينا</title>
<link rel="stylesheet" href="../../kit/brand.css">
<script src="../../kit/anim.js"></script>
<style>
.reel .logo { top: 110px; }
.top { position: absolute; top: 220px; right: 80px; left: 80px; height: 300px; text-align: center; }
.top > * { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#q b { font-size: 80px; font-weight: 700; color: var(--wine); line-height: 1.25; }
#counter { flex-direction: row; gap: 26px; }
#counter b { font-size: 240px; font-weight: 700; color: var(--wine); line-height: 1; direction: ltr; }
#counter span { font-size: 90px; font-weight: 700; color: var(--deep); }
#result b { font-size: 118px; font-weight: 700; color: var(--wine); line-height: 1.15; }
#result span { margin-top: 18px; font-size: 46px; font-weight: 600; color: var(--deep); }
.tile { position: absolute; width: 445px; height: 540px; border-radius: 34px; overflow: hidden; box-shadow: 0 24px 50px rgba(74, 13, 18, .14); }
.tile img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; display: block; }
.tile i { position: absolute; top: 18px; right: 18px; width: 76px; height: 76px; border-radius: 50%; background: var(--wine); color: var(--cream); font-style: normal; font-size: 44px; font-weight: 700; display: grid; place-items: center; }
#t1 { top: 570px; right: 80px; } #t2 { top: 570px; left: 80px; } #t3 { top: 1140px; right: 80px; } #t4 { top: 1140px; left: 80px; }
#end { position: absolute; inset: 0; background: var(--deep); color: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 160px; }
#end img { width: 300px; height: auto; }
#end h2 { margin: 70px 0 0; font-size: 104px; font-weight: 700; line-height: 1.2; }
#end p { margin: 16px 0 0; font-size: 48px; font-weight: 500; color: #E4D3BF; }
#end .chip { margin-top: 54px; font-size: 46px; padding: 14px 44px 18px; background: var(--gold); color: var(--deep); }
</style>
</head>
<body>
<div class="reel">
    <img class="logo" id="lg" src="../../kit/logo_burgundy.png" alt="روا">
    <div class="top">
        <div id="q"><b>كم كوب تحتاج<br>عشان التوصيل يصير مجاني؟</b></div>
        <div id="counter"><b>1</b><span>كوب</span></div>
        <div id="result"><b>= التوصيل علينا</b><span>توصيل مجاني لأي طلب فوق 10 ر.ع</span></div>
    </div>
    <div class="tile" id="t1"><img src="../../../images/categories/quotes.jpg" alt=""><i>1</i></div>
    <div class="tile" id="t2"><img src="../../../images/categories/clubs.jpg" alt=""><i>2</i></div>
    <div class="tile" id="t3"><img src="../../../images/categories/girls.jpg" alt=""><i>3</i></div>
    <div class="tile" id="t4"><img src="../../../images/categories/university.jpg" alt=""><i>4</i></div>
    <div id="end">
        <img src="../../kit/logo_white.png" alt="روا">
        <h2 id="e1">الكوب بـ 2.800 ر.ع</h2>
        <p id="e2">بدل 3.500 ر.ع</p>
        <span class="chip" id="e3">اطلب من الرابط في البايو</span>
    </div>
</div>
<script>
window.DURATION = 10;
window.COVER_T = 5.4;
const steps = [1.0, 1.8, 2.6, 3.4];
const words = ["كوب", "كوبين", "أكواب", "أكواب"];
window.render = (t) => {
    // السؤال
    const q = A.win(t, 0.1, 1.05, 0.3);
    A.set("#q", { o: q, s: 0.94 + 0.06 * A.out(A.p(t, 0.1, 0.5)) });
    // العدّاد
    const n = steps.filter((s) => t >= s).length;
    const counterOn = t >= 1.0 && t < 4.45;
    A.$("#counter b").textContent = String(Math.max(1, n));
    A.$("#counter span").textContent = words[Math.max(0, n - 1)];
    if (counterOn) {
        const last = steps[Math.max(0, n - 1)];
        const k = A.p(t, last, last + 0.35);
        A.set("#counter", { o: Math.min(1, A.p(t, 1.0, 1.2)) * (1 - A.p(t, 4.25, 4.45)), s: 0.8 + 0.2 * A.back(k) });
    } else A.set("#counter", { o: 0 });
    // النتيجة
    if (t >= 4.4) A.pop("#result", t, 4.45, 0.5); else A.set("#result", { o: 0 });
    // الصور
    ["#t1", "#t2", "#t3", "#t4"].forEach((id, i) => {
        if (t < steps[i]) { A.set(id, { o: 0 }); return; }
        const k = A.p(t, steps[i], steps[i] + 0.45);
        const settle = A.p(t, 4.45, 5.0);
        A.set(id, { o: Math.min(1, k * 2), s: (0.7 + 0.3 * A.back(k)) * (1 - 0.03 * A.out(settle)), y: (1 - A.out(k)) * 50 });
    });
    // الخاتمة
    const e = A.inout(A.p(t, 6.6, 7.0));
    A.set("#end", { o: e });
    A.set("#lg", { o: 1 - e });
    A.rise("#e1", t, 6.9, 0.5);
    A.rise("#e2", t, 7.15, 0.5);
    A.pop("#e3", t, 7.5, 0.5);
};
window.render(0);
</script>
</body>
</html>
