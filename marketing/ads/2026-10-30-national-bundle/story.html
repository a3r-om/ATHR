<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ستوري 10 ثوانٍ: باقة اليوم الوطني العماني — وفّر 20%</title>
<link rel="stylesheet" href="../../kit/brand.css">
<script src="../../kit/anim.js"></script>
<style>
.reel { background: #570418; color: #F2E9DA; font-family: "Plex", sans-serif; overflow: hidden; }
.abs { position: absolute; }
.sc { inset: 0; }
.lat { inset: -200px; opacity: .10; background: repeating-linear-gradient(45deg, #F2E9DA 0 2px, transparent 2px 64px), repeating-linear-gradient(-45deg, #F2E9DA 0 2px, transparent 2px 64px); }
.flag { left: 0; right: 0; height: 22px; display: flex; direction: ltr; z-index: 20; }
.flag i { flex: 1; } .w { background: #fff; } .r { background: #DB161B; } .g { background: #008000; }
.c { left: 0; right: 0; text-align: center; }
/* intro */
#in .ring { left: 50%; top: 760px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%; border: 8px solid #F5B301; display: grid; place-items: center; font-size: 330px; font-weight: 700; color: #F5B301; direction: ltr; line-height: 1; padding-bottom: 20px; box-sizing: border-box; }
#in .t1 { top: 420px; font-size: 104px; font-weight: 700; }
#in .t2 { top: 1380px; font-size: 64px; font-weight: 600; color: #E4D3BF; }
#in .bars { left: 50%; top: 1330px; width: 420px; margin-left: -210px; height: 14px; display: flex; direction: ltr; overflow: hidden; }
#in .bars i { flex: 1; }
/* product scenes */
.arch { left: 110px; top: 250px; width: 860px; height: 1010px; border-radius: 430px 430px 44px 44px; overflow: hidden; border: 10px solid #F2E9DA; box-shadow: 0 30px 70px rgba(0,0,0,.45); background: #ddd; }
.arch img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 60%; }
.bdg { left: 90px; top: 1120px; width: 230px; height: 230px; border-radius: 50%; background: #D6DB89; color: #570418; display: grid; place-content: center; text-align: center; font-weight: 700; line-height: 1; box-shadow: 0 16px 34px rgba(0,0,0,.4); z-index: 5; }
.bdg small { font-size: 46px; display: block; } .bdg b { font-size: 96px; direction: ltr; display: block; }
.nm { top: 1340px; font-size: 150px; font-weight: 700; line-height: 1.1; }
.sb { top: 1520px; font-size: 62px; font-weight: 600; color: #F5B301; }
.dots { top: 1630px; display: flex; gap: 18px; justify-content: center; direction: ltr; }
.dots i { width: 18px; height: 18px; border-radius: 50%; background: rgba(242,233,218,.35); }
.dots i.on { background: #F5B301; width: 54px; border-radius: 9px; }
/* finale */
#fn { background: #EFE3CF; color: #570418; }
#fn .lat { background: repeating-linear-gradient(45deg, #570418 0 2px, transparent 2px 64px), repeating-linear-gradient(-45deg, #570418 0 2px, transparent 2px 64px); opacity: .12; }
#fn .pill span { display: inline-block; border: 4px solid #570418; border-radius: 999px; padding: 6px 50px 14px; font-size: 50px; font-weight: 700; } #fn .pill b { color: #B3261E; }
#fn .h2 { top: 430px; font-size: 90px; font-weight: 600; }
#fn .h3 { top: 510px; font-size: 440px; font-weight: 700; line-height: 1; direction: ltr; }
#fn .sub { top: 1000px; font-size: 62px; font-weight: 700; }
.th { top: 1150px; width: 270px; height: 270px; border-radius: 50%; overflow: hidden; border: 10px solid #fff; box-shadow: 0 20px 40px rgba(87,4,24,.28); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
#th1 { left: 95px; } #th2 { left: 405px; } #th3 { left: 715px; }
#fn .lg { left: 50%; margin-left: -80px; top: 1500px; width: 160px; height: auto; }
#fn .cta { top: 1680px; } #fn .cta span { display: inline-block; background: #570418; color: #F2E9DA; border-radius: 999px; padding: 8px 54px 16px; font-size: 48px; font-weight: 700; }
</style>
</head>
<body>
<div class="reel">

<div class="abs sc" id="in">
  <div class="abs lat"></div>
  <div class="abs c t1" id="i1">العيد الوطني العُماني</div>
  <div class="abs ring" id="i2">56</div>
  <div class="abs bars" id="i3"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs c t2" id="i4">كل عام وعُمان بخير</div>
</div>

<div class="abs sc" id="s1">
  <div class="abs lat"></div>
  <div class="abs arch"><img src="img/mug_hd.jpg" style="object-position:50% 55%" alt=""></div>
  <div class="abs bdg"><small>وفّر</small><b>20%</b></div>
  <div class="abs c nm">المج</div>
  <div class="abs c sb">ضمن باقة اليوم الوطني</div>
  <div class="abs c dots"><i class="on"></i><i></i><i></i></div>
</div>
<div class="abs sc" id="s2">
  <div class="abs lat"></div>
  <div class="abs arch"><img src="img/cup_hd.jpg" style="object-position:50% 70%" alt=""></div>
  <div class="abs bdg"><small>وفّر</small><b>20%</b></div>
  <div class="abs c nm">الكوب</div>
  <div class="abs c sb">ضمن باقة اليوم الوطني</div>
  <div class="abs c dots"><i></i><i class="on"></i><i></i></div>
</div>
<div class="abs sc" id="s3">
  <div class="abs lat"></div>
  <div class="abs arch"><img src="img/wallet_hd.jpg" style="transform:scale(1.25);object-position:50% 50%" alt=""></div>
  <div class="abs bdg"><small>وفّر</small><b>20%</b></div>
  <div class="abs c nm">المحفظة</div>
  <div class="abs c sb">ضمن باقة اليوم الوطني</div>
  <div class="abs c dots"><i></i><i></i><i class="on"></i></div>
</div>

<div class="abs sc" id="fn">
  <div class="abs lat"></div>
  <div class="abs c pill" style="top:280px"><span>العيد الوطني العُماني <b>56</b></span></div>
  <div class="abs c h2" id="f1">باقة اليوم الوطني · وفّر</div>
  <div class="abs c h3" id="f2"><span id="num">20%</span></div>
  <div class="abs c sub" id="f3">مج + كوب + محفظة · <b>7.360</b> ر.ع <s style="opacity:.6;font-size:.8em">9.200</s></div>
  <div class="abs th" id="th1"><img src="img/mug_hd.jpg" alt=""></div>
  <div class="abs th" id="th2"><img src="img/cup_hd.jpg" style="object-position:50% 70%" alt=""></div>
  <div class="abs th" id="th3"><img src="img/wallet_hd.jpg" style="transform:scale(1.4)" alt=""></div>
  <img class="abs lg" id="f4" src="../../kit/logo_burgundy.png" alt="روا">
  <div class="abs c cta" id="f5"><span>تسوّق الآن · roa-om.com</span></div>
</div>

<div class="abs flag" style="top:0"><i class="w"></i><i class="r"></i><i class="g"></i></div>
<div class="abs flag" style="bottom:0"><i class="w"></i><i class="r"></i><i class="g"></i></div>
</div>
<script>
window.DURATION = 10;
window.COVER_T = 9.5;
const SC = [["#s1", 2.0, 3.7], ["#s2", 3.7, 5.4], ["#s3", 5.4, 7.1]];
window.render = (t) => {
  document.querySelectorAll(".lat").forEach((l) => { l.style.transform = `translate(${-t * 12}px, ${t * 8}px)`; });
  // intro 0 - 2.5
  A.set("#in", { o: 1 - A.p(t, 1.9, 2.2) });
  A.rise("#i1", t, 0.1, 0.5, 40);
  A.pop("#i2", t, 0.4, 0.6);
  A.$("#i3").style.clipPath = `inset(0 ${(1 - A.out(A.p(t, 1.0, 1.6))) * 50}% 0 ${(1 - A.out(A.p(t, 1.0, 1.6))) * 50}%)`;
  A.rise("#i4", t, 1.2, 0.5, 30);
  // product scenes
  SC.forEach(([id, a, b], i) => {
    const el = A.$(id);
    const o = Math.min(A.p(t, a, a + 0.3), 1 - A.p(t, b - 0.01, b + 0.25));
    el.style.opacity = o;
    if (o <= 0) return;
    const k = A.out(A.p(t, a, a + 0.7));
    el.querySelector(".arch").style.transform = `translateY(${(1 - k) * 140}px) scale(${0.94 + 0.06 * k})`;
    el.querySelector(".arch img").style.transform = (id === "#s3" ? "scale(" + (1.25 + 0.08 * A.p(t, a, b)) + ")" : `scale(${1.02 + 0.08 * A.p(t, a, b)})`);
    const bd = el.querySelector(".bdg");
    A.pop(bd, t, a + 0.35, 0.5, { r: -10 });
    A.rise(el.querySelector(".nm"), t, a + 0.25, 0.5, 40);
    A.rise(el.querySelector(".sb"), t, a + 0.45, 0.5, 30);
  });
  // finale from 8.5
  const f = A.p(t, 7.0, 7.3);
  A.set("#fn", { o: f });
  A.rise("#f1", t, 7.2, 0.45, 40);
  document.getElementById("num").textContent = Math.round(20 * A.out(A.p(t, 7.4, 8.2))) + "%";
  A.pop("#f2", t, 7.4, 0.5);
  A.rise("#f3", t, 7.9, 0.4, 30);
  ["#th1", "#th2", "#th3"].forEach((s, i) => A.pop(s, t, 7.95 + i * 0.1, 0.4));
  A.rise("#f4", t, 8.2, 0.4, 20);
  A.rise("#f5", t, 8.3, 0.4, 20);
};
window.render(0);
</script>
</body>
</html>
