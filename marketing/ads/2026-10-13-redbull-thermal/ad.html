<script>
window.DURATION = 23.4;
window.COVER_T = 8.9;
const BEAT = 0.6;                                         // 100 نبضة/دقيقة
const T = {
    off: 0.8, kob: 0.85, dw: 1.5, light: 1.85,
    s2: 3.0, h2a: 3.15, h2b: 3.45, c0: 3.3, c1: 5.4, both: 7.8, tag: 8.15,
    s3: 10.2, t3a: 10.6, t3b: 11.0, zoom: 12.6, cards: 12.65, t3c: 13.2, t3d: 13.55,
    s4: 15.0, rows: [15.25, 15.9],
    s5: 17.4, logo: 17.5, t5a: 17.75, t5b: 18.5, t5c: 19.1, t5d: 19.6, shine: 20.6, end: 22.2
};
window.TIMELINE = T;
const WHIPS = [[3.0, -1], [10.2, 1], [15.0, -1], [17.4, 1]];
const SCENES = [["s1", 0, 3.0], ["s2", 3.0, 10.2], ["s3", 10.2, 15.0], ["s4", 15.0, 17.4], ["s5", 17.4, 99]];

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const ei = (x) => x * x * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const frac = (x) => x - Math.floor(x);
function rnd(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

const baseFilter = new Map();
function put(el, { o = 1, x = 0, y = 0, z = 0, s = 1, sx = 1, rx = 0, ry = 0, rz = 0, b = 0 } = {}) {
    if (typeof el === "string") el = $(el);
    if (!baseFilter.has(el)) baseFilter.set(el, el.style.filter || "");
    el.style.opacity = String(clamp(o));
    el.style.transform = (el.tagName === "SPAN" ? "" : "translate(-50%,-50%) ") + `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s * sx},${s})`;
    const bf = baseFilter.get(el);
    el.style.filter = (b > 0.4 ? `blur(${b.toFixed(1)}px) ` : "") + bf || "none";
}
function slam(el, t, at, dur = 0.32, extra = {}) { const k = p(t, at, at + dur); put(el, { o: k * 3, s: lerp(1.75, 1, eo(k)), b: (1 - k) * 16, ...extra }); return k; }
function rise(el, t, at, dur = 0.4, extra = {}) { const k = p(t, at, at + dur); put(el, { o: k * 2, y: (1 - eo(k)) * 90, b: (1 - k) * 12, ...extra }); return k; }
function popIn(el, t, at, dur = 0.4, extra = {}) { const k = p(t, at, at + dur); put(el, { o: k * 3, s: 0.55 + 0.45 * back(k), b: (1 - k) * 8, ...extra }); return k; }
function draw(svg, k) {
    const ds = svg.querySelectorAll(".d"), n = ds.length;
    ds.forEach((d, i) => { const kk = clamp(k * (n * 0.55 + 0.45) - i * 0.55); d.style.strokeDashoffset = String(1 - eo(kk)); });
}
function shine(el, t, at, dur = 0.7) {
    const k = p(t, at, at + dur);
    el.style.opacity = k > 0 && k < 1 ? "1" : "0";
    el.style.transform = `translateX(${lerp(-90, 90, eio(k))}%)`;
}
function ellPath(cx, cy, rx, ry, rot, a0, turns, wob = 0) {
    const pts = [], N = Math.round(120 * turns);
    const c = Math.cos(rot * Math.PI / 180), s = Math.sin(rot * Math.PI / 180);
    for (let i = 0; i <= N; i++) {
        const a = a0 + (i / N) * turns * Math.PI * 2;
        const r = 1 + wob * Math.sin(a * 3 + 1.3) + wob * 0.6 * Math.sin(a * 7 + 0.4);
        const x = Math.cos(a) * rx * r, y = Math.sin(a) * ry * r;
        pts.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    return "M" + pts.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L");
}
function setTrail(id, d) { $(id).querySelectorAll("path").forEach((pp) => { pp.setAttribute("d", d); pp.setAttribute("pathLength", "1"); }); }
function streak(id, u, L = 0.3, o = 1) {
    const g = $(id), show = u > 0 && u < 1;
    g.style.opacity = show ? String(o) : "0";
    if (!show) return;
    g.querySelectorAll("path").forEach((pp) => { pp.style.strokeDasharray = `${L} ${1 + L}`; pp.style.strokeDashoffset = String(L - u * (1 + L)); });
}
function stroke(id, k, o = 1) {
    const g = $(id);
    g.style.opacity = k > 0 ? String(o) : "0";
    g.querySelectorAll("path").forEach((pp) => { pp.style.strokeDasharray = "1 1"; pp.style.strokeDashoffset = String(1 - k); });
}
setTrail("#tr1", ellPath(540, 1300, 380, 140, -7, Math.PI * 0.9, 1.35, 0.03));
setTrail("#tr2", "M1150 1300 C 900 1380, 760 980, 560 1020 S 220 760, -80 620");
setTrail("#tr3", "M-60 1500 C 200 1620, 520 1520, 640 1380 S 980 1160, 1160 1240");
setTrail("#tr5", "M960 900 C 800 945, 620 935, 420 915 S 180 915, 110 945");

// معيّنات الشعار تطفو في العمق
const DECOR = [];
(function () {
    const r = rnd(42), host = $("#decor");
    [[90, 330], [985, 290], [150, 1580], [940, 1640], [60, 900], [1020, 1020], [260, 230], [820, 1790],
     [990, 620], [70, 1300], [880, 470], [210, 1820], [1010, 1380], [130, 610], [700, 1700], [380, 1750]].forEach(([x, y], i) => {
        const el = document.createElement("div");
        const sz = 16 + r() * 34;
        el.className = "dm " + (i % 3 === 1 ? "line" : "fill");
        el.style.width = el.style.height = sz.toFixed(0) + "px";
        host.appendChild(el);
        DECOR.push({ el, x, y, z: -380 + r() * 420, sp: 8 + r() * 18, rot: r() * 90, vr: (r() - 0.5) * 40, ph: r() * 6.28, a: 0.35 + r() * 0.45 });
    });
})();
function decor(t) {
    const fadeIn = p(t, 0.6, 1.6);
    for (const d of DECOR) {
        const yy = d.y - ((t * d.sp) % 2200);
        const y = yy < -150 ? yy + 2200 : yy;
        d.el.style.opacity = String(d.a * (0.75 + 0.25 * Math.sin(t * 1.7 + d.ph)) * fadeIn);
        d.el.style.transform = `translate(-50%,-50%) translate3d(${d.x + Math.sin(t * 0.6 + d.ph) * 14}px,${y}px,${d.z}px) rotate(${45 + d.rot + t * d.vr}deg)`;
    }
}
function makeSparks(hostId, list) {
    const host = $(hostId);
    return list.map(([x, y, at, size]) => {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("class", "spk"); s.setAttribute("viewBox", "-40 -40 80 80");
        s.innerHTML = '<path d="M0 -36 C3 -8 8 -3 36 0 C8 3 3 8 0 36 C-3 8 -8 3 -36 0 C-8 -3 -3 -8 0 -36Z"/>';
        s.style.left = x + "px"; s.style.top = y + "px"; s.style.width = s.style.height = size + "px";
        host.appendChild(s);
        return { el: s, at };
    });
}
function sparks(list, t, period = 0) {
    for (const sp of list) {
        let u = (t - sp.at) / 0.7;
        if (period && t > sp.at) u = frac((t - sp.at) / period) * (period / 0.7);
        const k = u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0;
        sp.el.style.opacity = String(k);
        sp.el.style.transform = `translate(-50%,-50%) scale(${0.2 + k}) rotate(${u * 90}deg)`;
    }
}
const SP5 = makeSparks("#spk5", [[260, 330, 17.8, 54], [820, 360, 18.0, 64], [880, 1180, 19.3, 50], [190, 1120, 19.6, 58], [540, 1500, 19.9, 46]]);

// ---------- الكاميرا ----------
function cam(t) {
    const c = { x: 0, y: 0, s: 1, rx: 0, ry: 0, rz: 0 };
    c.rx = 9 + 2.5 * Math.sin(t * 0.8);
    c.ry = 7 * Math.sin(t * 0.5 + 0.6);
    c.rz = 1.4 * Math.sin(t * 0.37);
    const ki = eio(p(t, 0, 1.0));
    c.rx = lerp(66, c.rx, ki); c.s *= lerp(1.6, 1, ki); c.y += lerp(340, 0, ki); c.rz += lerp(-12, 0, ki);
    for (const [W, d] of WHIPS) {
        if (t >= W - 0.22 && t < W) { const k = ei(p(t, W - 0.22, W)); c.x += d * 950 * k; c.ry += d * 26 * k; c.rz += d * 5 * k; }
        else if (t >= W && t < W + 0.32) { const k = 1 - eo(p(t, W, W + 0.32)); c.x -= d * 950 * k; c.ry -= d * 26 * k; c.rz -= d * 5 * k; }
    }
    if (t >= T.zoom - 0.45 && t < T.zoom) {
        const k = ei(p(t, T.zoom - 0.45, T.zoom)), s = lerp(1, 9, k);
        c.rx = lerp(c.rx, 0, k); c.ry = lerp(c.ry, 0, k); c.rz = lerp(c.rz, 0, k);
        c.s *= s; c.y += 280 * (s - 1);
    } else if (t >= T.zoom && t < T.zoom + 0.4) {
        c.s *= lerp(0.3, 1, eo(p(t, T.zoom, T.zoom + 0.4)));
    }
    for (const [S, a] of [[T.light, 12], [T.both, 10], [T.t5a, 8]]) {
        if (t >= S && t < S + 0.35) { const k = 1 - p(t, S, S + 0.35); c.x += Math.sin(t * 95) * a * k; c.y += Math.cos(t * 81) * a * k; }
    }
    if (t >= T.s5) c.s *= 1 + 0.05 * p(t, T.s5, DURATION);
    return c;
}
function applyCam(t) {
    const c = cam(t), o = cam(t - 1 / 30);
    $("#world").style.transform = `translate(${c.x}px,${c.y}px) scale(${c.s}) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg)`;
    const ds = Math.abs(Math.log(c.s / o.s)) * 520;
    const bx = Math.min(70, Math.abs((c.x - o.x) + (c.ry - o.ry) * 14 + (c.rz - o.rz) * 10) * 0.42 + ds * 0.35);
    const by = Math.min(70, Math.abs((c.y - o.y) + (c.rx - o.rx) * 10) * 0.42 + ds * 0.35);
    const camEl = $("#cam");
    if (bx + by > 0.8) { $("#mbg").setAttribute("stdDeviation", `${bx.toFixed(1)} ${by.toFixed(1)}`); camEl.style.filter = "url(#mb)"; }
    else camEl.style.filter = "none";
    $("#grid").style.transform = `translateZ(-160px) translateY(${(t * 24) % 120}px)`;
}

// توهج ملوّن حول صورة كوب ريد بول (كأنه يضوي)
const GLOW = { blue: [40, 110, 255], pink: [255, 70, 180] };
function glowCard(el, rgb, t, amt) {
    const pu = 0.75 + 0.25 * Math.sin(t * 5.2) + 0.08 * Math.sin(t * 13.7);
    const a = (0.55 + 0.45 * pu) * amt;
    const c = rgb.join(",");
    el.style.boxShadow = `0 0 ${(28 * pu).toFixed(0)}px rgba(${c},${(0.9 * a).toFixed(2)}), 0 0 ${(90 * pu).toFixed(0)}px rgba(${c},${(0.75 * a).toFixed(2)}), 0 0 ${(170 * pu).toFixed(0)}px rgba(${c},${(0.45 * a).toFixed(2)}), 0 24px 50px rgba(74,13,18,.28)`;
    el.style.borderColor = amt > 0.5 ? `rgb(${rgb.map((v) => Math.round(lerp(v, 255, 0.35))).join(",")})` : "#7D1420";
}

window.render = function (t) {
    for (const [id, a, b] of SCENES) $("#" + id).style.display = t >= a && t < b ? "block" : "none";
    applyCam(t);
    decor(t);
    const fl = (at, a, d) => (t >= at ? a * (1 - p(t, at, at + d)) : 0);
    $("#flash").style.opacity = String(Math.max(fl(T.light, 0.35, 0.2), fl(T.zoom, 0.3, 0.18)));

    // 1) طفّي النور... (الشاشة تظلم) وخلّ كوبك يضوي (الكوب يشتغل نوره)
    if (t < 3.0) {
        const ic = $("#icCup");
        draw(ic, p(t, 0.15, 0.75));
        put(ic, { o: t > 0.1 ? 1 : 0, s: 1 + 0.06 * Math.sin(Math.PI * p(t, T.light, T.light + 0.3)), y: Math.sin(t * 2.2) * 8 });
        const kd = t >= T.off ? (t < T.off + 0.12 ? (Math.sin((t - T.off) * 120) > 0 ? 0.6 : 1) : 1) : 0;
        $("#dim1").style.opacity = String(0.95 * kd);
        const col = kd > 0.5 ? "#F3E2C4" : "#7D1420";
        ic.querySelectorAll(".d").forEach((d) => (d.style.stroke = col));
        const on = t >= T.light ? (t < T.light + 0.25 ? (Math.sin((t - T.light) * 90) > 0 ? 1 : 0.25) : 1) : 0;
        $("#cupGlow").setAttribute("opacity", String(0.75 * on * (0.85 + 0.15 * Math.sin(t * 6))));
        $("#rays").setAttribute("opacity", String(on * (0.6 + 0.4 * Math.sin(t * 8))));
        ic.style.filter = on ? `drop-shadow(0 0 ${(22 + 10 * Math.sin(t * 6)).toFixed(0)}px rgba(233,167,46,.95)) drop-shadow(0 0 70px rgba(233,167,46,.7))` : (kd ? "drop-shadow(0 0 6px rgba(243,226,196,.35))" : "");
        slam("#t1a", t, T.kob, 0.3);
        const kf = p(t, T.dw, T.dw + 0.3);
        const flick = t < T.dw + 0.45 && t > T.dw ? (Math.sin((t - T.dw) * 70) > -0.2 ? 1 : 0.3) : 1;
        put("#t1b", { o: clamp(kf * 3) * flick, s: lerp(1.75, 1, eo(kf)), b: (1 - kf) * 16 });
        streak("#tr1", eio(p(t, T.light, T.light + 1.0)), 0.42);
    }

    // 2) أكواب ريد بول المضيئة
    if (t >= 3.0 && t < 10.2) {
        const kdim = p(t, T.both, T.both + 0.3);
        const kh = p(t, T.h2a, T.h2a + 0.35);
        put("#h2a", { o: kh * 2 - kdim * 2, y: (1 - eo(kh)) * -80, b: (1 - kh) * 12 });
        const kb = p(t, T.h2b, T.h2b + 0.3);
        const flick = t > T.h2b && t < T.h2b + 0.45 ? (Math.sin((t - T.h2b) * 80) > -0.2 ? 1 : 0.3) : 1;
        put("#h2b", { o: clamp(kb * 3) * flick - kdim * 2, s: lerp(1.6, 1, eo(kb)), b: (1 - kb) * 14 });
        $("#dim").style.opacity = String(0.95 * eo(kdim));
        // الكرت الأول (أزرق) ثم الثاني (وردي) بقلبة، ثم الاثنين جنب بعض
        const c0 = $("#rb0"), c1 = $("#rb1");
        const kin0 = p(t, T.c0, T.c0 + 0.4), kout0 = p(t, T.c1 - 0.22, T.c1);
        const kin1 = p(t, T.c1, T.c1 + 0.38);
        const kbo = eio(p(t, T.both, T.both + 0.5));
        if (t < T.both) {
            c0.style.display = t < T.c1 ? "block" : "none";
            c0.style.transform = `translate(-50%,-50%) translate3d(540px,1060px,0) rotateY(${(lerp(-100, 0, eo(kin0)) + 100 * ei(kout0)).toFixed(1)}deg) scale(${lerp(0.8, 1, eo(kin0))})`;
            c0.style.opacity = String(clamp(kin0 * 3));
            c1.style.display = t >= T.c1 ? "block" : "none";
            c1.style.transform = `translate(-50%,-50%) translate3d(540px,1060px,0) rotateY(${lerp(-100, 0, eo(kin1)).toFixed(1)}deg) scale(${lerp(0.8, 1, eo(kin1))})`;
            c1.style.opacity = "1";
            glowCard(c0, GLOW.blue, t, 0.55);
            glowCard(c1, GLOW.pink, t, 0.55);
        } else {
            c0.style.display = c1.style.display = "block";
            c0.style.opacity = c1.style.opacity = "1";
            c1.style.transform = `translate(-50%,-50%) translate3d(${lerp(540, 318, kbo)}px,${lerp(1060, 900, kbo)}px,0) rotateY(${lerp(0, 12, kbo)}deg) rotateZ(${lerp(0, -4, kbo)}deg) scale(${lerp(1, 0.7, kbo)})`;
            c0.style.transform = `translate(-50%,-50%) translate3d(${lerp(1300, 762, kbo)}px,900px,0) rotateY(${lerp(-40, -12, kbo)}deg) rotateZ(${lerp(8, 4, kbo)}deg) scale(0.7)`;
            glowCard(c0, GLOW.blue, t, lerp(0.55, 1.25, kdim));
            glowCard(c1, GLOW.pink, t + 0.7, lerp(0.55, 1.25, kdim));
        }
        [[0, T.c0 + 0.25, T.c1], [1, T.c1 + 0.25, T.both]].forEach(([i, a, b]) => {
            const el = $("#chip" + i);
            if (t < a || t >= b) { el.style.opacity = "0"; return; }
            popIn(el, t, a, 0.35);
        });
        shine(c0.querySelector(".shine"), t, T.c0 + 0.5, 0.7);
        shine(c1.querySelector(".shine"), t, t < T.both ? T.c1 + 0.5 : T.both + 0.9, 0.7);
        slam("#tag2a", t, T.tag, 0.3);
        rise("#tag2b", t, T.tag + 0.45);
        const ts = [T.c0, T.c1, T.both].reduce((a, v) => (t >= v ? v : a), T.c0);
        streak("#tr2", eio(p(t, ts + 0.05, ts + 0.8)), 0.35, 0.9);
    }

    // 3) الأكواب الحرارية
    if (t >= 10.2 && t < 15.0) {
        const ic = $("#icTh");
        const pre = t < T.zoom;
        ic.style.display = pre ? "block" : "none";
        if (pre) {
            draw(ic, p(t, 10.25, 10.95));
            put(ic, { o: 1, y: Math.sin(t * 3) * 6 });
            slam("#t3a", t, T.t3a, 0.32);
            const km = p(t, T.t3b, T.t3b + 0.9);
            $("#ml").textContent = String(Math.round(750 * eo(km)));
            rise("#t3b", t, T.t3b, 0.35);
        } else { $("#t3a").style.opacity = "0"; $("#t3b").style.opacity = "0"; }
        const kc = p(t, T.cards, T.cards + 0.45);
        [["#th0", 780, -1], ["#th1", 300, 1]].forEach(([id, x, d], i) => {
            const el = $(id), k = p(t, T.cards + i * 0.12, T.cards + 0.45 + i * 0.12);
            el.style.display = t >= T.cards ? "block" : "none";
            el.style.opacity = String(clamp(k * 3));
            el.style.transform = `translate(-50%,-50%) translate3d(${x}px,${840 + Math.sin(t * 2 + i) * 8}px,0) rotateY(${(lerp(d * 90, d * 10, eo(k))).toFixed(1)}deg) rotateZ(${(-d * 3).toFixed(1)}deg) scale(${lerp(0.7, 1, eo(k))})`;
            shine(el.querySelector(".shine"), t, T.t3c + 0.3 + i * 0.25, 0.7);
        });
        [["#chipW", 0], ["#chipP", 1]].forEach(([id, i]) => (t >= T.cards + 0.35 ? popIn(id, t, T.cards + 0.35 + i * 0.12, 0.35) : ($(id).style.opacity = "0")));
        slam("#t3c", t, T.t3c, 0.32);
        rise("#t3d", t, T.t3d, 0.4);
        streak("#tr3", eio(p(t, T.cards + 0.1, T.cards + 0.9)), 0.35, 0.85);
    }

    // 4) التوصيل والدفع
    if (t >= 15.0 && t < 17.4) {
        T.rows.forEach((at, i) => {
            const el = $("#r" + i), k = p(t, at, at + 0.4);
            put(el, { o: k * 2, y: (1 - eo(k)) * 90, s: lerp(0.85, 1, eo(k)), b: (1 - k) * 12 });
            draw(el.querySelector("svg"), p(t, at + 0.05, at + 0.6));
        });
    }

    // 5) اطلب الحين
    if (t >= 17.4) {
        popIn("#logo5", t, T.logo, 0.45, { y: Math.sin((t - T.logo) * 2) * 6 });
        const ks = p(t, T.shine, T.shine + 0.8);
        $("#shr5").setAttribute("x", String(lerp(-160, 490, eio(ks))));
        $("#shr5").style.opacity = ks > 0 && ks < 1 ? "1" : "0";
        slam("#t5a", t, T.t5a, 0.32);
        stroke("#tr5", eio(p(t, T.t5a + 0.25, T.t5a + 0.75)), 1);
        rise("#t5b", t, T.t5b);
        rise("#t5c", t, T.t5c);
        rise("#t5d", t, T.t5d);
        sparks(SP5, t, 2.2);
    }
};
window.render(0);
</script>
</body>
</html>
