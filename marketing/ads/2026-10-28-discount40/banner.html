<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعلان المتجر — خصم يصل إلى 40%</title>
<link rel="stylesheet" href="../../kit/brand.css">
<script src="../../kit/anim.js"></script>
<style>
html, body { background: #111; margin: 0; }
.reel { width: 1296px; height: 602px; position: relative; overflow: hidden; direction: rtl; font-family: "Plex", sans-serif; color: #fff; background: #F4EDE1; }
.abs { position: absolute; }
.ph { top: 0; height: 602px; width: 232px; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; display: block; transform-origin: 50% 60%; }
.ph b { position: absolute; bottom: 36px; right: 0; left: 0; text-align: center; font-size: 34px; font-weight: 700; }
.ph b span { display: inline-block; background: #fff; color: #9B0A10; padding: 2px 26px 8px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
#p1 { left: 0; } #p2 { left: 212px; } #p3 { left: 424px; width: 330px; }
#panel { top: 0; right: 0; width: 660px; height: 602px; background: linear-gradient(160deg, #DB161B, #8E080E); clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%); }
#stripe { top: 0; right: 0; width: 696px; height: 602px; background: #008000; clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%); }
#lat { top: 0; right: 0; width: 660px; height: 602px; opacity: .09; clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%); background: repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 46px), repeating-linear-gradient(-45deg, #fff 0 2px, transparent 2px 46px); }
.flag { top: 0; right: 0; left: 0; height: 14px; display: flex; direction: ltr; z-index: 9; }
.flag i { flex: 1; } .w { background: #fff; } .r { background: #DB161B; } .g { background: #008000; }
.txt { right: 70px; white-space: nowrap; transform-origin: 100% 50%; }
#h2 { top: 78px; font-size: 58px; font-weight: 600; }
#h3 { top: 150px; font-size: 215px; font-weight: 700; line-height: 1.02; direction: ltr; text-shadow: 0 8px 0 rgba(0,0,0,.2); text-align: right; min-width: 460px; }
#sub { top: 410px; font-size: 40px; font-weight: 600; }
#btn { top: 480px; padding: 8px 44px 14px; background: #fff; color: #008000; border-radius: 999px; font-size: 38px; font-weight: 700; box-shadow: 0 12px 26px rgba(0,0,0,.3); }
#lg { left: 700px; bottom: 26px; width: 92px; height: auto; z-index: 6; }
#shine { top: 0; right: 0; width: 660px; height: 602px; clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%); background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.28) 50%, transparent 58%); opacity: 0; }
</style>
</head>
<body>
<div class="reel">
  <div class="abs ph" id="p1"><img src="../../../images/categories/mugs.jpg" alt=""><b><span>مج</span></b></div>
  <div class="abs ph" id="p2"><img src="../../../images/categories/quotes.jpg" alt=""><b><span>كوب</span></b></div>
  <div class="abs ph" id="p3"><img src="../../../images/categories/clubs-wallets.jpg" alt=""><b><span>محفظة</span></b></div>
  <div class="abs" id="stripe"></div>
  <div class="abs" id="panel"></div>
  <div class="abs" id="lat"></div>
  <div class="abs" id="shine"></div>
  <div class="abs flag"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs txt" id="h2">خصم يصل إلى</div>
  <div class="abs txt" id="h3"><span id="num">40%</span></div>
  <div class="abs txt" id="sub">على المجات والأكواب والمحافظ</div>
  <div class="abs" id="btn">تسوّق الآن</div>
  <img class="abs" id="lg" src="../../kit/logo_white.png" alt="روا">
</div>
<script>
window.DURATION = 5;
window.COVER_T = 3.6;
window.render = (t) => {
  ["#p1", "#p2", "#p3"].forEach((s, i) => {
    const k = A.out(A.p(t, 0.1 + i * 0.18, 0.8 + i * 0.18));
    const el = A.$(s);
    el.style.clipPath = `inset(${(1 - k) * 100}% 0 0 0)`;
    el.querySelector("img").style.transform = `scale(${1.18 - 0.1 * A.p(t, 0, 5)})`;
  });
  const pk = A.out(A.p(t, 0.3, 1.0));
  A.$("#panel").style.transform = `translateX(${(1 - pk) * 760}px)`;
  A.$("#lat").style.transform = `translateX(${(1 - pk) * 760}px)`;
  A.$("#stripe").style.transform = `translateX(${(1 - A.out(A.p(t, 0.45, 1.15))) * 820}px)`;
  A.rise("#h2", t, 0.9, 0.45, 30);
  document.getElementById("num").textContent = Math.round(40 * A.out(A.p(t, 1.1, 2.1))) + "%";
  A.pop("#h3", t, 1.1, 0.5);
  A.rise("#sub", t, 1.9, 0.45, 30);
  A.pop("#btn", t, 2.5, 0.5);
  A.set("#btn", { s: 1 + 0.04 * Math.max(0, Math.sin((t - 3) * 5)) * A.p(t, 3, 3.2) });
  A.rise("#lg", t, 2.9, 0.5, 20);
  const sh = A.p(t, 2.2, 3.0);
  A.set("#shine", { o: sh > 0 && sh < 1 ? 1 : 0 });
  A.$("#shine").style.transform = `translateX(${(sh - 0.5) * -900}px)`;
};
window.render(0);
</script>
</body>
</html>
