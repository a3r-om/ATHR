<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعلان أثر — بطاقة المتجر</title>
<link rel="stylesheet" href="../../kit/brand.css">
<style>
/* أسلوب الفيديو المرجعي (Harshit): بطاقة واجهة تنبني قدامك، والكاميرا تقرّب وتلحق الكلام وهو ينكتب بضبابية، ثم تبعد وتصغّر البطاقة */
:root { --bgc: #E7D7C3; --card: #2A0A0E; --panel: #FBF6EE; --ink: #1E0A0C; --gray: #B4A29B; --soft: #EFE4D6; --wine: #7D1420; --gold: #D9A441; --cream: #F4EADC; }
.reel { background: var(--bgc); font-family: "Plex", sans-serif; color: var(--ink); }
#bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 45%, #F0E5D6 0%, #E7D7C3 55%, #DCC8B1 100%); }
#cam { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 540px 960px; }
#world { position: absolute; left: 0; top: 0; width: 900px; height: 1300px; transform-origin: 0 0; }
#card { position: absolute; border-radius: 48px; background: linear-gradient(155deg, #3B1117 0%, #2A0A0E 45%, #1C0609 100%); box-shadow: 0 60px 110px rgba(74, 13, 18, .32), 0 14px 30px rgba(74, 13, 18, .22); overflow: hidden; }
#panel { position: absolute; left: 16px; right: 16px; background: var(--panel); border-radius: 36px; }
#content { position: absolute; left: 0; top: 0; width: 900px; height: 1300px; direction: rtl; }
.a { position: absolute; white-space: nowrap; }
.ty { position: absolute; white-space: nowrap; line-height: 1.2; }
.ty .s { display: block; }
.ty .b { position: absolute; left: 0; top: 0; filter: blur(9px); opacity: .85; }
.ty .cur { position: absolute; top: 12%; height: 76%; width: 7px; border-radius: 4px; background: var(--wine); }
.star { width: 22px; height: 22px; position: absolute; }
.chip { padding: 6px 22px 10px; border-radius: 999px; background: var(--soft); font-size: 25px; font-weight: 600; color: #6E5A55; direction: ltr; }
#gift { position: absolute; background: var(--soft); overflow: hidden; }
.gi { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: var(--wine); display: grid; place-items: center; box-shadow: 0 8px 18px rgba(125, 20, 32, .3); }
.gi svg { width: 36px; height: 36px; }
.wpill { position: absolute; height: 70px; border-radius: 999px; background: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 600; box-shadow: 0 6px 16px rgba(74, 13, 18, .08); }
.btn { padding: 14px 46px 20px; border-radius: 999px; background: var(--wine); color: var(--cream); font-size: 34px; font-weight: 700; box-shadow: 0 16px 30px rgba(125, 20, 32, .35); }
.tile { position: absolute; width: 177px; height: 210px; border-radius: 28px; overflow: hidden; box-shadow: 0 14px 26px rgba(74, 13, 18, .18); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.li { position: absolute; display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 500; color: rgba(244, 234, 220, .9); white-space: nowrap; }
.li svg { width: 36px; height: 36px; flex: 0 0 36px; overflow: visible; }
.li .d { fill: none; stroke: rgba(217, 164, 65, .9); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }
#end { position: absolute; inset: 0; display: none; }
#endLogo { position: absolute; left: 540px; top: 800px; width: 460px; height: 356px; margin: -178px 0 0 -230px; }
#endLogo img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="reel" id="reel">
    <div id="bg"></div>
    <svg width="0" height="0" style="position:absolute">
        <filter id="mb" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter>
    </svg>
    <div id="cam">
        <div id="world">
            <div id="card">
                <div id="panel"></div>
                <div id="content">
                    <!-- الوسم -->
                    <svg class="star" id="st1" viewBox="0 0 24 24" style="left:822px;top:62px"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="#1E0A0C"/></svg>
                    <div class="ty" id="tag" style="right:96px;top:50px;font-size:29px;font-weight:600"><span class="s">أكواب سيراميك وهدايا</span><span class="b">أكواب سيراميك وهدايا</span></div>
                    <svg class="star" id="st2" viewBox="0 0 24 24" style="left:0;top:62px"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="#1E0A0C"/></svg>
                    <div class="a chip" id="chip" style="left:44px;top:42px">@a3r_om</div>
                    <!-- العنوان -->
                    <div class="ty" id="hd" style="right:52px;top:100px;font-size:120px;font-weight:700;letter-spacing:-1px"><span class="s">أكواب تشبهك</span><span class="b">أكواب تشبهك</span><i class="cur"></i></div>
                    <div class="a" id="sb" style="right:56px;top:252px;font-size:64px;font-weight:600;color:var(--gray);line-height:1.2"><span id="w1">وكل</span> <span id="w2">كوب</span> <span id="w3">يترك أثر</span></div>
                    <!-- يمين: الدفع -->
                    <div class="ty" id="cod" style="right:56px;top:392px;font-size:46px;font-weight:700"><span class="s">الدفع عند الاستلام</span><span class="b">الدفع عند الاستلام</span></div>
                    <div class="a btn" id="order" style="right:56px;top:480px">اطلب الحين</div>
                    <!-- يسار: الهدية -->
                    <div id="gift"></div>
                    <div class="gi a" id="gico" style="left:334px;top:404px"><svg viewBox="0 0 24 24" fill="none" stroke="#F4EADC" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="1.2"/><rect x="3" y="7" width="18" height="3.4" rx="1"/><path d="M12 7v13M12 7C10.6 3.6 7 4 7.6 6.2 8 7.4 12 7 12 7Zm0 0c1.4-3.4 5-3 4.4-.8C16 7.4 12 7 12 7Z"/></svg></div>
                    <div class="ty" id="gq" style="right:582px;top:410px;font-size:34px;font-weight:700"><span class="s">تبي تهدي أحد؟</span><span class="b">تبي تهدي أحد؟</span></div>
                    <div class="wpill" id="gbtn" style="left:68px;top:492px;width:332px">أرسلها هدية ←</div>
                    <!-- صور المنتجات -->
                    <div class="tile" id="p1" style="left:667px;top:614px"><img src="../../../images/t/1sxsif1txeh-m.webp" alt=""></div>
                    <div class="tile" id="p2" style="left:470px;top:614px"><img src="../../../images/t/1t091cfjk2s-m.webp" alt=""></div>
                    <div class="tile" id="p3" style="left:273px;top:614px"><img src="../../../images/t/7vcms8hodq-m.webp" alt=""></div>
                    <div class="tile" id="p4" style="left:76px;top:614px"><img src="../../../images/t/z56pmmhapz-m.webp" alt=""></div>
                    <!-- القوائم -->
                    <div id="lists"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- الختام -->
    <div id="end">
        <div id="endLogo"><img src="../../kit/logo_burgundy.png" alt=""></div>
        <div class="ty" id="e1" style="left:540px;top:1035px;font-size:58px;font-weight:600;color:#6E5A55;transform:translateX(-50%)"><span class="s">أكواب سيراميك</span><span class="b">أكواب سيراميك</span></div>
        <div class="a chip" id="e2" style="left:540px;top:1150px;font-size:32px">@a3r_om</div>
        <div class="a btn" id="e3" style="left:540px;top:1250px;font-size:38px">الرابط في البايو</div>
    </div>
</div>

<script>
window.DURATION = 17.4;
window.COVER_T = 13.7;
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const ei = (x) => x * x * x;
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const expo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
const sine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const back = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lin = (x) => x;

// ---------- القوائم ----------
const L1 = ["أكواب العبارات", "أكواب الأندية", "أكواب الجامعات", "أكواب البنات"];
const L2 = ["مجات وأكواب حرارية", "أكواب ريد بول المضيئة", "المحافظ", "حقائب المكياج"];
const CHK = '<svg viewBox="0 0 36 36"><circle class="d" cx="18" cy="18" r="15" pathLength="1" transform="rotate(-90 18 18)"/><path class="d" pathLength="1" d="M11.5 18.5l4.5 4.5 8.5-9"/></svg>';
const lists = $("#lists");
const LI = [];
[[L1, 70], [L2, 470]].forEach(([arr, right], c) => arr.forEach((txt, i) => {
    const d = document.createElement("div");
    d.className = "li";
    d.style.right = right + "px";
    d.style.top = (930 + i * 70) + "px";
    d.innerHTML = CHK + `<span class="ty" style="position:relative"><span class="s">${txt}</span><span class="b">${txt}</span></span>`;
    lists.appendChild(d);
    LI.push(d);
}));

// ---------- التوقيت (نفس music.py) ----------
const T = {
    line: 0.15, thick: 0.55, sq: 1.15, panel: 1.45, grow: 2.0, land: 2.42,
    st1: 2.55, st2: 2.85, tag: 2.6,
    hd: 3.35, w: [4.45, 4.75, 5.05],
    chip: 5.8, box: 5.95, gico: 6.75, gq: 6.85, gbtn: 7.35, gpress: 7.6,
    cod: 8.35, order: 8.7, opress: 9.0,
    ph: [9.6, 9.75, 9.9, 10.05],
    li: [10.65, 10.95, 11.25, 11.55, 11.95, 12.2, 12.45, 12.7],
    out: 12.85, shrink: 14.25, gone: 14.7,
    logo: 14.85, e1: 15.2, e2: 15.7, e3: 15.95, end: 17.4
};
window.TIMELINE = T;

// ---------- الكاميرا: [الزمن، x، y، تقريب، دوران، الحركة] ----------
const K = [
    [0.00, 450, 650, 1.00, 0, lin],
    [2.00, 450, 650, 1.00, 0, lin],
    [2.42, 640, 250, 2.10, -1.5, expo],
    [3.25, 632, 255, 2.10, -1.0, lin],
    [4.30, 515, 270, 1.52, 0.5, sine],
    [5.30, 505, 280, 1.48, 1.0, sine],
    [5.75, 252, 412, 1.95, 2.0, expo],
    [7.80, 240, 430, 2.00, 1.5, lin],
    [8.25, 620, 470, 1.95, -1.0, expo],
    [9.15, 608, 478, 1.95, -1.5, lin],
    [9.55, 450, 684, 1.30, 0, expo],
    [10.20, 450, 690, 1.30, 0.3, lin],
    [10.55, 640, 1062, 1.90, -1.0, expo],
    [11.55, 628, 1066, 1.90, -1.0, lin],
    [11.88, 272, 1070, 1.90, 1.5, expo],
    [12.85, 282, 1070, 1.90, 1.5, lin],
    [13.15, 450, 650, 0.93, 0, expo],
    [14.25, 450, 650, 0.95, 0, sine],
    [14.65, 450, 650, 0.05, -6, (x) => Math.pow(x, 2.2)],
    [17.40, 450, 650, 0.05, -6, lin]
];
function cam(t) {
    let i = 0;
    while (i < K.length - 2 && t >= K[i + 1][0]) i++;
    const a = K[i], b = K[i + 1], k = b[5](clamp((t - a[0]) / (b[0] - a[0])));
    return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: lerp(a[3], b[3], k), r: lerp(a[4], b[4], k) };
}

// ---------- أدوات ----------
function wipe(el, k, cursor = false) {
    if (typeof el === "string") el = $(el);
    const s = el.querySelector(".s"), b = el.querySelector(".b"), c = el.querySelector(".cur");
    if (k <= 0) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    if (k >= 1) {
        s.style.webkitMaskImage = s.style.maskImage = "none";
        b.style.display = "none";
        if (c) c.style.display = "none";
        return;
    }
    const q = k * 135;
    s.style.webkitMaskImage = s.style.maskImage = `linear-gradient(to left, #000 ${q - 32}%, transparent ${q - 12}%)`;
    b.style.display = "block";
    b.style.webkitMaskImage = b.style.maskImage = `linear-gradient(to left, transparent ${q - 34}%, #000 ${q - 18}%, transparent ${q}%)`;
    if (c) {
        const w = s.offsetWidth, x = clamp((q - 16) / 100);
        c.style.display = cursor ? "block" : "none";
        c.style.left = (w * (1 - x) - 10) + "px";
    }
}
function pop(el, t, at, d = 0.32, from = 0.55) {
    if (typeof el === "string") el = $(el);
    const k = p(t, at, at + d);
    el.style.opacity = String(clamp(k * 3));
    el.style.transform = (el.dataset.base || "") + ` scale(${lerp(from, 1, back(k))})`;
    el.style.filter = k < 1 ? `blur(${((1 - k) * 10).toFixed(1)}px)` : "none";
    return k;
}
function press(el, t, at) {
    const k = p(t, at, at + 0.22);
    return k > 0 && k < 1 ? 1 - 0.09 * Math.sin(Math.PI * k) : 1;
}
const drawChk = (svg, k) => svg.querySelectorAll(".d").forEach((d, i) => { d.style.strokeDashoffset = String(1 - eo(clamp(k * 1.6 - i * 0.6))); });

const card = $("#card"), panel = $("#panel"), content = $("#content"), world = $("#world"), cmv = $("#cam"), mbg = $("#mbg");
$("#e2").dataset.base = "translateX(-50%)";
$("#e3").dataset.base = "translateX(-50%)";
$("#endLogo").dataset.base = "";

window.render = function (t) {
    // ---- شكل البطاقة: خط ← مستطيل ← مربع ← اللوحة تطلع ← تكبر لحجمها ----
    let w = 0, h = 0, rad = 48;
    if (t < T.thick) { const k = eo(p(t, T.line, T.thick)); w = 400 * k; h = 4; rad = 2; }
    else if (t < T.sq) { const k = back(p(t, T.thick, T.sq)); w = lerp(400, 440, k); h = lerp(4, 290, k); rad = lerp(2, 34, clamp(k)); }
    else if (t < T.grow) { const k = eio(p(t, T.sq, T.sq + 0.45)); w = 440; h = lerp(290, 450, k); rad = 34; }
    else { const k = eio(p(t, T.grow, T.land)); w = lerp(440, 900, k); h = lerp(450, 1300, k); rad = lerp(34, 48, k); }
    card.style.display = t < T.line || t >= T.gone ? "none" : "block";
    card.style.left = (450 - w / 2) + "px"; card.style.top = (650 - h / 2) + "px";
    card.style.width = w + "px"; card.style.height = Math.max(h, 0) + "px"; card.style.borderRadius = rad + "px";
    // اللوحة الكريمية: تطلع من تحت وتغطي، ثم تنكمش لفوق
    let pt, pb;
    if (t < T.panel) { pt = h; pb = h; }
    else if (t < T.grow) {
        const k1 = eio(p(t, T.panel, T.panel + 0.38)), k2 = eio(p(t, T.panel + 0.22, T.grow));
        pt = lerp(h - 14, 14, k1); pb = lerp(h - 14, 14 + (h - 28) * 0.672, k2);
    } else { pt = 16 * h / 1300 + 2; pb = pt + (h - 32) * 0.672; }
    const pin = t < T.grow ? 14 : lerp(14, 16, p(t, T.grow, T.land));
    panel.style.left = pin + "px"; panel.style.right = pin + "px";
    panel.style.top = pt + "px"; panel.style.height = Math.max(0, pb - pt) + "px";
    panel.style.borderRadius = Math.min(36, Math.max(0, (pb - pt) / 2), rad - 10) + "px";
    panel.style.display = pb - pt > 0.5 ? "block" : "none";
    content.style.display = t >= T.land - 0.05 ? "block" : "none";

    // ---- الكاميرا + ضبابية الحركة + ميلان ثلاثي الأبعاد ----
    const c = cam(t), c0 = cam(t - 1 / 60), c1 = cam(t + 0.02), cm = cam(t - 0.02);
    world.style.transform = `translate(540px,960px) rotate(${c.r.toFixed(2)}deg) rotateY(${clamp((c1.x - cm.x) / 0.04 * c.z / 900, -7, 7).toFixed(2)}deg) rotateX(${clamp(-(c1.y - cm.y) / 0.04 * c.z / 1400, -6, 6).toFixed(2)}deg) scale(${c.z.toFixed(4)}) translate(${-c.x.toFixed(2)}px,${-c.y.toFixed(2)}px)`;
    const iso = Math.abs(c.z - c0.z) / Math.max(c.z, 0.05) * 540 * 0.6;
    const bx = Math.min(40, Math.max(Math.abs(c.x - c0.x) * c.z, iso) / 2.2), by = Math.min(40, Math.max(Math.abs(c.y - c0.y) * c.z, iso) / 2.2);
    if (bx > 0.5 || by > 0.5) { mbg.setAttribute("stdDeviation", `${bx.toFixed(1)} ${by.toFixed(1)}`); cmv.style.filter = "url(#mb)"; }
    else cmv.style.filter = "none";

    // ---- المحتوى ----
    const st1 = $("#st1"), st2 = $("#st2");
    pop(st1, t, T.st1, 0.3, 0.2);
    wipe("#tag", p(t, T.tag, T.tag + 0.42));
    const tagW = $("#tag .s").offsetWidth;
    st2.style.left = (900 - 96 - tagW - 36) + "px";
    pop(st2, t, T.st2, 0.3, 0.2);
    wipe("#hd", p(t, T.hd, T.hd + 0.9), true);
    ["#w1", "#w2", "#w3"].forEach((id, i) => { const e = $(id); e.style.display = "inline-block"; pop(e, t, T.w[i], 0.3, 0.7); });
    // الشريحة + صندوق الهدية
    pop("#chip", t, T.chip, 0.3, 0.4);
    const gift = $("#gift");
    const g1 = eo(p(t, T.box, T.box + 0.25)), g2 = back(p(t, T.box + 0.2, T.box + 0.55));
    const gw = lerp(26, 380, g2), gh = lerp(lerp(0, 150, g1), 200, clamp(g2));
    gift.style.display = t >= T.box ? "block" : "none";
    gift.style.left = (234 - gw / 2) + "px"; gift.style.top = (480 - gh / 2) + "px";
    gift.style.width = gw + "px"; gift.style.height = Math.max(0, gh) + "px"; gift.style.borderRadius = Math.min(34, gw / 2) + "px";
    pop("#gico", t, T.gico, 0.3, 0.3);
    wipe("#gq", p(t, T.gq, T.gq + 0.4));
    const gb = $("#gbtn");
    gb.dataset.base = "";
    pop(gb, t, T.gbtn, 0.3, 0.6);
    if (t > T.gbtn + 0.3) gb.style.transform = `scale(${press(gb, t, T.gpress)})`;
    // الدفع + زر الطلب
    wipe("#cod", p(t, T.cod, T.cod + 0.4));
    const ob = $("#order");
    pop(ob, t, T.order, 0.3, 0.6);
    if (t > T.order + 0.3) ob.style.transform = `scale(${press(ob, t, T.opress)})`;
    // الصور
    ["#p1", "#p2", "#p3", "#p4"].forEach((id, i) => pop(id, t, T.ph[i], 0.34, 0.5));
    // القوائم
    LI.forEach((d, i) => {
        const at = T.li[i];
        drawChk(d.querySelector("svg"), p(t, at - 0.05, at + 0.3));
        d.style.visibility = t >= at - 0.05 ? "visible" : "hidden";
        wipe(d.querySelector(".ty"), p(t, at + 0.02, at + 0.36));
    });

    // ---- الختام ----
    $("#end").style.display = t >= T.logo - 0.05 ? "block" : "none";
    if (t >= T.logo - 0.05) {
        const lg = $("#endLogo"), k = p(t, T.logo, T.logo + 0.4);
        lg.style.opacity = String(clamp(k * 3));
        lg.style.transform = `scale(${lerp(0.3, 1, back(k))}) rotate(${lerp(-8, 0, eo(k))}deg)`;
        lg.style.filter = k < 1 ? `blur(${((1 - k) * 12).toFixed(1)}px)` : "none";
        wipe("#e1", p(t, T.e1, T.e1 + 0.45));
        pop("#e2", t, T.e2, 0.3, 0.5);
        pop("#e3", t, T.e3, 0.32, 0.5);
        const fl = Math.sin((t - T.logo) * 1.6) * 6;
        $("#endLogo").style.marginTop = (-178 + fl * clamp(p(t, T.logo + 0.4, T.logo + 1))) + "px";
    }
};
window.render(0);
</script>
</body>
</html>
