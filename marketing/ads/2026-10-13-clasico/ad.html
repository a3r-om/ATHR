<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعلان روا — مدريدي ولا برشلوني؟</title>
<link rel="stylesheet" href="../../kit/brand.css">
<style>
:root { --dark: #4A0D12; --cream: #F7F1E8; --acc: #F2A516; --wine: #7D1420; }
.reel { background: var(--cream); font-family: "Plex", sans-serif; }
.layer { position: absolute; inset: 0; }
.txt { position: absolute; white-space: nowrap; line-height: 1.1; }
.caret { display: inline-block; width: 8px; height: 0.9em; background: var(--acc); vertical-align: -0.08em; margin-inline-start: 8px; border-radius: 2px; }
.mark { color: var(--acc); }
.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.night { background: radial-gradient(ellipse 75% 48% at 50% 47%, #6A1820 0%, #4A0D12 72%); }
.half { position: absolute; left: 0; width: 1080px; height: 954px; overflow: hidden; background: #E9E6E1; }
.half img { position: absolute; left: 0; top: -63px; width: 1080px; height: 1080px; object-fit: cover; }
.tag { position: absolute; right: 80px; padding: 12px 32px 22px; background: var(--dark); color: var(--cream); font-size: 56px; font-weight: 700; border-radius: 12px 12px 40px 12px; white-space: nowrap; box-shadow: 0 14px 30px rgba(40, 10, 10, .22); }
.pill { font-size: 84px; font-weight: 700; color: var(--dark); background: var(--acc); padding: 12px 44px 28px; border-radius: 14px 14px 46px 14px; box-shadow: 0 18px 40px rgba(20, 5, 5, .35); }
.head { position: absolute; right: 90px; top: 250px; font-size: 92px; font-weight: 700; color: var(--cream); white-space: nowrap; line-height: 1.15; }
.card { position: absolute; left: 90px; top: 460px; width: 900px; height: 900px; border-radius: 16px 16px 64px 16px; overflow: hidden; background: #E9E6E1; box-shadow: 0 34px 80px rgba(10, 2, 2, .45); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.chips { position: absolute; right: 90px; top: 1430px; display: flex; gap: 22px; }
.chip { padding: 14px 32px 22px; background: var(--acc); color: var(--dark); font-size: 54px; font-weight: 700; border-radius: 12px 12px 40px 12px; white-space: nowrap; box-shadow: 0 14px 30px rgba(20, 5, 5, .25); }
.chip small { font-size: 32px; font-weight: 600; margin-inline-start: 8px; }
.chip.alt { background: var(--cream); }
.tile { position: absolute; width: 440px; height: 440px; border-radius: 16px 16px 50px 16px; overflow: hidden; background: #E9E6E1; box-shadow: 0 18px 40px rgba(60, 20, 10, .18); }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.now { font-size: 140px; font-weight: 700; color: var(--dark); line-height: 1; }
.now small { font-size: 56px; margin-inline-start: 10px; }
.was { position: relative; font-size: 64px; color: rgba(74, 13, 18, .5); line-height: 1; }
.was i { position: absolute; right: -6px; top: 52%; height: 6px; background: var(--acc); border-radius: 3px; }
.off { background: var(--dark); color: var(--cream); font-size: 48px; font-weight: 700; padding: 8px 24px 16px; border-radius: 12px 12px 34px 12px; direction: ltr; line-height: 1.1; }
.fact { position: absolute; right: 120px; display: flex; align-items: center; gap: 26px; font-size: 62px; font-weight: 600; color: var(--dark); white-space: nowrap; }
.fact b { width: 72px; height: 72px; border-radius: 50%; background: var(--acc); display: grid; place-items: center; flex-shrink: 0; }
.fact svg { width: 40px; height: 40px; fill: none; stroke: var(--dark); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.fact.hot { color: var(--wine); font-weight: 700; }
</style>
</head>
<body>
<div class="reel" id="reel">
    <div class="layer" id="bg"></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <filter id="stain" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
                <feGaussianBlur in="d" stdDeviation="1.6"/>
            </filter>
        </defs>
    </svg>

    <!-- A: «مدريدي / ولا برشلوني؟» -->
    <div class="txt" id="a1" style="font-size:160px;font-weight:700;color:var(--cream)"></div>
    <div class="txt" id="a2" style="font-size:160px;font-weight:700;color:var(--cream)"></div>

    <!-- B: نصفين + «اختار فريقك» -->
    <div class="scene" id="sb" style="z-index:10">
        <div class="half" id="hT" style="top:0"><img src="../../../images/t/za1xge3mhw-m.webp" alt=""><div class="tag" style="top:230px">ريال مدريد</div></div>
        <div class="half" id="hB" style="top:966px"><img src="../../../images/t/28gbozy4u59-m.webp" alt=""><div class="tag" style="top:120px">برشلونة</div></div>
        <div class="txt pill" id="pill"></div>
    </div>

    <!-- C: ريال مدريد -->
    <div class="scene night" id="sc" style="z-index:11">
        <div class="head"></div>
        <div class="card"><img class="w" src="../../../images/t/za1xge3mhw-m.webp" alt=""><img class="k" src="../../../images/t/t5sfmeikxj-m.webp" alt=""></div>
        <div class="chips"><div class="chip c1">3.500<small>ر.ع</small></div><div class="chip alt c2">أبيض أو أسود</div></div>
    </div>

    <!-- D: برشلونة -->
    <div class="scene night" id="sd" style="z-index:12">
        <div class="head"></div>
        <div class="card"><img class="w" src="../../../images/t/28gbozy4u59-m.webp" alt=""><img class="k" src="../../../images/t/2c2jrt7x7s1-m.webp" alt=""></div>
        <div class="chips"><div class="chip c1">3.500<small>ر.ع</small></div><div class="chip alt c2">أبيض أو أسود</div></div>
    </div>

    <!-- E: هدية لكل مشجّع -->
    <div class="scene" id="se" style="z-index:13;background:var(--cream)">
        <div class="head" style="color:var(--dark)"></div>
        <div class="tile" id="t0" style="left:552px;top:520px"><img src="../../../images/t/za1xge3mhw-m.webp" alt=""></div>
        <div class="tile" id="t1" style="left:88px;top:520px"><img src="../../../images/t/28gbozy4u59-m.webp" alt=""></div>
        <div class="tile" id="t2" style="left:552px;top:984px"><img src="../../../images/t/t5sfmeikxj-m.webp" alt=""></div>
        <div class="tile" id="t3" style="left:88px;top:984px"><img src="../../../images/t/2c2jrt7x7s1-m.webp" alt=""></div>
        <div class="chips" style="top:1490px"><div class="chip" id="gchip">مع بطاقة إهداء فيها رسالتك</div></div>
    </div>

    <!-- F: السعر والحقائق -->
    <div class="scene" id="sf" style="z-index:14;background:var(--cream)">
        <div class="txt" id="f_t" style="font-size:150px;font-weight:700;color:var(--dark)">أكواب سيراميك</div>
        <div class="txt" id="f_p" style="display:flex;align-items:center;gap:30px"><span class="now">3.500<small>ر.ع</small></span></div>
        <div class="fact" id="f0" style="top:880px"><b><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></b>الدفع عند الاستلام</div>
        <div class="fact" id="f1" style="top:1040px"><b><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></b>توصيل لكل عُمان والخليج</div>
        <div class="fact hot" id="f2" style="top:1200px"><b><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></b>3 أكواب = التوصيل مجاني</div>
    </div>

    <!-- G: كلمة على كل نبضة -->
    <div class="scene" id="sg" style="z-index:15;background:var(--dark)">
        <div class="txt" id="fw" style="font-size:180px;font-weight:700;color:var(--cream)"></div>
    </div>

    <!-- H: الشعار داخل الدائرة -->
    <div class="scene" id="sh" style="z-index:16;background:var(--cream)">
        <svg class="layer" viewBox="-540 -960 1080 1920" aria-hidden="true">
            <g transform="translate(0 -120)">
                <g id="bigRing" filter="url(#stain)">
                    <circle r="330" fill="none" stroke="#7D1420" stroke-opacity=".7" stroke-width="22"/>
                    <circle r="314" fill="none" stroke="#7D1420" stroke-opacity=".22" stroke-width="12"/>
                    <circle r="304" fill="#7D1420" fill-opacity=".05"/>
                </g>
                <clipPath id="logoWipe"><rect id="wipeRect" x="492" y="-10" width="0" height="400"/></clipPath>
                <g transform="translate(-241 -187)">
                    <path clip-path="url(#logoWipe)" fill="#4A0D12" d="M0 226L73 153V226H316.5L390.5 152.5V226A74 74 0 0 1 316.5 300H74L0 374ZM408 150.5L481.5 77V300H408ZM408 37H426.5A36.5 36.5 0 0 1 463 0.5V37H481.5V73.5H408Z"/>
                    <path id="dg0" fill="#F2A516" d="M269.8 68.7L305.8 104.7L269.8 140.7L233.8 104.7Z"/>
                    <path id="dg1" fill="#F2A516" d="M307.6 121.6L343.6 157.6L307.6 193.6L271.6 157.6Z"/>
                    <path id="dg2" fill="#F2A516" d="M232 121.7L268 157.7L232 193.7L196 157.7Z"/>
                </g>
            </g>
        </svg>
        <div class="txt" id="g1" style="font-size:96px;font-weight:700;color:var(--dark)"></div>
        <div class="txt" id="h1" style="font-size:72px;font-weight:700;color:var(--cream);background:var(--wine);padding:14px 46px 26px;border-radius:14px 14px 46px 14px">اطلب الحين</div>
        <div class="txt" id="h2" style="font-size:46px;color:rgba(74,13,18,.7)">الرابط في البايو</div>
    </div>
</div>

<script src="../../kit/anim.js"></script>
<script>
// 90 نبضة/دقيقة: النبضة 0.667 ث، المقطع 2.667 ث
const TL = {
    a1: 0.5, a2: 1.5,
    b: 4.0, b2: 4.67, pill: 5.33,
    c: 8.0, cswap: 10.67,
    d: 13.33, dswap: 16.0,
    e: 18.67, tiles: [19.0, 19.33, 19.67, 20.0], gchip: 20.67,
    f: 22.67, price: 24.0, facts: [24.67, 25.33, 26.0],
    w: 27.33, words: [27.33, 28.0, 28.67],
    g: 30.0, h: 32.67
};
window.DURATION = 36.0;
window.COVER_T = 7.2;
const $ = (s) => document.querySelector(s);
const show = (el, on, disp = "") => { el.style.display = on ? disp : "none"; };
const p = A.p, back = A.back;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeIn = (x) => x * x * x;
function typed(full, t, start, cps) {
    const chars = Array.from(full);
    const n = t < start ? 0 : Math.min(chars.length, Math.floor((t - start) * cps) + 1);
    return { text: chars.slice(0, n).join(""), done: n >= chars.length, n, chars };
}
const blink = (t, from) => (t < from ? true : Math.floor((t - from) / 0.45) % 2 === 0);
const caret = (on) => `<span class="caret" style="opacity:${on ? 1 : 0}"></span>`;
function center(el, y, x = 540) {
    el.style.left = "0px"; el.style.top = "0px";
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = `${x - w / 2}px`; el.style.top = `${y - h / 2}px`;
    return { w, h };
}
function set(el, { o = 1, x = 0, y = 0, s = 1, r = 0 } = {}) {
    el.style.opacity = String(o);
    el.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg)`;
}
// قناع مائل 45° (توقيع الإعلانات)
function wipe(el, k, deg = 225) {
    const m = `linear-gradient(${deg}deg, #000 ${k * 100}%, transparent ${k * 100 + 0.01}%)`;
    el.style.webkitMaskImage = el.style.maskImage = k < 1 ? m : "none";
}
function scene(id, t, t0, t1, deg = 225) {
    const el = document.getElementById(id);
    const on = t >= t0 && t < t1;
    el.style.display = on ? "block" : "none";
    if (on) wipe(el, easeInOut(p(t, t0, t0 + 0.55)), deg);
    return on ? el : null;
}
function pop(el, t, at, dur = 0.4, from = 0.8) {
    const k = back(p(t, at, at + dur));
    set(el, { o: easeOut(p(t, at, at + dur * 0.4)), s: from + (1 - from) * k, y: (1 - Math.min(1, k)) * 24 });
}

function club(el, t, T, SW, head, end) {
    const h = el.querySelector(".head");
    const ty = typed(head, t, T + 0.35, 12);
    h.innerHTML = ty.text + caret(!ty.done || blink(t, T + 1.7));
    const card = el.querySelector(".card");
    const ck = easeOut(p(t, T + 0.05, T + 0.8));
    set(card, { y: (1 - ck) * 70, s: 0.95 + 0.05 * ck });
    const kb = p(t, T, end);
    el.querySelectorAll(".card img").forEach((img) => { img.style.transform = `scale(${1.0 + 0.07 * kb})`; });
    wipe(el.querySelector("img.k"), easeInOut(p(t, SW, SW + 0.6)), 45);
    pop(el.querySelector(".c1"), t, T + 1.2);
    pop(el.querySelector(".c2"), t, SW + 0.4);
}

window.render = function (t) {
    $("#bg").style.background = "#4A0D12";

    // ---- A: السؤال ----
    const a1 = $("#a1"), a2 = $("#a2");
    const aOn = t < TL.b2 + 0.6;
    show(a1, aOn); show(a2, aOn);
    if (aOn) {
        const s = 1 + 0.04 * easeInOut(p(t, 2.6, TL.b));
        const t1 = typed("مدريدي", t, TL.a1, 9);
        a1.innerHTML = t1.text + (t < TL.a2 ? caret(true) : "");
        center(a1, 850);
        const t2 = typed("ولا برشلوني؟", t, TL.a2, 10);
        const ch = t2.text;
        const body = ch.endsWith("؟") ? ch.slice(0, -1) + '<span class="mark">؟</span>' : ch;
        a2.innerHTML = t >= TL.a2 ? body + caret(!t2.done || blink(t, TL.a2 + 1.3)) : "";
        center(a2, 1050);
        a1.style.transform = a2.style.transform = `scale(${s})`;
    }

    // ---- B: نصفين ----
    const sb = $("#sb");
    const bOn = t >= TL.b && t < TL.c + 0.6;
    sb.style.display = bOn ? "block" : "none";
    if (bOn) {
        const hT = $("#hT"), hB = $("#hB");
        wipe(hT, easeInOut(p(t, TL.b, TL.b + 0.55)), 225);
        wipe(hB, easeInOut(p(t, TL.b2, TL.b2 + 0.55)), 45);
        const kb = p(t, TL.b, TL.c + 0.6);
        hT.querySelector("img").style.transform = `scale(${1.08 - 0.06 * kb}) translateX(${14 * kb}px)`;
        hB.querySelector("img").style.transform = `scale(${1.08 - 0.06 * kb}) translateX(${-14 * kb}px)`;
        pop(hT.querySelector(".tag"), t, TL.b + 0.45);
        pop(hB.querySelector(".tag"), t, TL.b2 + 0.45);
        const pill = $("#pill");
        show(pill, t >= TL.pill);
        if (t >= TL.pill) {
            const ty = typed("اختار فريقك", t, TL.pill + 0.2, 12);
            pill.innerHTML = (ty.text || "&nbsp;") + caret(!ty.done || blink(t, TL.pill + 1.4));
            center(pill, 961);
            const k = back(p(t, TL.pill, TL.pill + 0.4));
            const beat = Math.max(0, 1 - Math.abs(t - 6.67) / 0.12) * 0.03 + Math.max(0, 1 - Math.abs(t - 7.33) / 0.12) * 0.03;
            set(pill, { o: easeOut(p(t, TL.pill, TL.pill + 0.15)), s: (0.8 + 0.2 * k) * (1 + beat) });
        }
    }

    // ---- C / D: كل نادي ----
    const sc = scene("sc", t, TL.c, TL.d + 0.6, 225);
    if (sc) club(sc, t, TL.c, TL.cswap, "كوب المدريدي", TL.d + 0.6);
    const sd = scene("sd", t, TL.d, TL.e + 0.6, 45);
    if (sd) club(sd, t, TL.d, TL.dswap, "كوب البرشلوني", TL.e + 0.6);

    // ---- E: هدية ----
    const se = scene("se", t, TL.e, TL.f + 0.6, 225);
    if (se) {
        const h = se.querySelector(".head");
        const ty = typed("هدية لكل مشجّع", t, TL.e + 0.3, 13);
        h.innerHTML = ty.text + caret(!ty.done || blink(t, TL.e + 1.6));
        TL.tiles.forEach((at, i) => pop(document.getElementById(`t${i}`), t, at, 0.45, 0.7));
        const kb = p(t, TL.e, TL.f + 0.6);
        se.querySelectorAll(".tile img").forEach((img, i) => { img.style.transform = `scale(${1.04 + 0.05 * kb})`; });
        pop($("#gchip"), t, TL.gchip);
    }

    // ---- F: السعر والحقائق ----
    const sf = scene("sf", t, TL.f, TL.w, 45);
    if (sf) {
        const ft = $("#f_t");
        const k = back(p(t, TL.f + 0.15, TL.f + 0.6));
        const up = easeInOut(p(t, TL.price - 0.5, TL.price));
        center(ft, 900 - up * 420);
        set(ft, { o: easeOut(p(t, TL.f + 0.15, TL.f + 0.35)), s: (0.86 + 0.14 * k) * (1 - 0.2 * up) });
        const fp = $("#f_p");
        center(fp, 680);
        pop(fp, t, TL.price, 0.45, 0.82);
        TL.facts.forEach((at, i) => {
            const el = document.getElementById(`f${i}`);
            const fk = easeOut(p(t, at, at + 0.5));
            set(el, { o: fk, x: (1 - fk) * -70 });
        });
    }

    // ---- G: كلمات ----
    const sg = $("#sg");
    const gOn = t >= TL.w && t < TL.g;
    sg.style.display = gOn ? "block" : "none";
    if (gOn) {
        const WORDS = ["اختار", "فريقك", "وابدأ <span class=\"mark\">طقسك</span>"];
        let j = 0;
        TL.words.forEach((w, n) => { if (t >= w) j = n; });
        const fw = $("#fw");
        fw.innerHTML = WORDS[j];
        fw.style.fontSize = j === 2 ? "190px" : "180px";
        center(fw, 960);
        const k = back(p(t, TL.words[j], TL.words[j] + 0.3));
        set(fw, { o: easeOut(p(t, TL.words[j], TL.words[j] + 0.1)), s: 0.82 + 0.18 * k });
    }

    // ---- H: الشعار ----
    const sh = $("#sh");
    const hOn = t >= TL.g;
    sh.style.display = hOn ? "block" : "none";
    if (hOn) {
        const g1 = $("#g1"), h1 = $("#h1"), h2 = $("#h2");
        const rk = easeOut(p(t, TL.g, TL.g + 0.6));
        $("#bigRing").setAttribute("transform", `scale(${0.7 + 0.3 * rk})`);
        $("#bigRing").setAttribute("opacity", String(rk));
        const wk = easeInOut(p(t, TL.g + 0.25, TL.g + 0.85));
        $("#wipeRect").setAttribute("width", String(510 * wk));
        $("#wipeRect").setAttribute("x", String(492 - 510 * wk));
        ["dg0", "dg1", "dg2"].forEach((id, i) => {
            const at = TL.g + 0.95 + i * 0.22;
            const dk = back(p(t, at, at + 0.35));
            const el = document.getElementById(id);
            const cx = [269.8, 307.6, 232][i], cy = [104.7, 157.6, 157.7][i];
            el.setAttribute("transform", `translate(${cx} ${cy}) scale(${Math.max(0.001, dk)}) translate(${-cx} ${-cy})`);
        });
        const ty = typed("كل كوب طقسٌ صغير", t, TL.g + 1.75, 14);
        g1.innerHTML = ty.text + (t >= TL.g + 1.6 && t < TL.h ? caret(blink(t, TL.g + 2.9)) : "");
        center(g1, 1300);
        show(h1, t >= TL.h); show(h2, t >= TL.h);
        if (t >= TL.h) {
            const hk = back(p(t, TL.h, TL.h + 0.4));
            center(h1, 1480);
            set(h1, { o: easeOut(p(t, TL.h, TL.h + 0.15)), s: 0.85 + 0.15 * hk });
            center(h2, 1600);
            h2.style.opacity = String(easeOut(p(t, TL.h + 0.5, TL.h + 0.9)));
        }
    }
};
document.fonts.ready.then(() => window.render(0));
</script>
</body>
</html>
