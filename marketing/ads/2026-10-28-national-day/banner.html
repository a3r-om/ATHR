<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعلان المتجر — العيد الوطني 56</title>
<link rel="stylesheet" href="../../kit/brand.css">
<script src="../../kit/anim.js"></script>
<style>
html, body { background: #111; margin: 0; }
.reel { width: 1296px; height: 602px; position: relative; overflow: hidden; direction: rtl; font-family: "Plex", sans-serif; color: #fff;
  background: radial-gradient(ellipse 1000px 600px at 75% 40%, #D81E24, #9B0A10 70%, #7A070C); }
.abs { position: absolute; }
#lat { inset: -60px; opacity: .10; background:
  repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 46px),
  repeating-linear-gradient(-45deg, #fff 0 2px, transparent 2px 46px); }
.flag { top: 0; right: 0; left: 0; height: 16px; display: flex; direction: ltr; z-index: 9; }
.flag i { flex: 1; } .w { background: #fff; } .r { background: #DB161B; } .g { background: #008000; }
#plate { left: 40px; top: 70px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,.82) 62%, rgba(255,255,255,.0) 63%); }
#ring { left: 20px; top: 50px; width: 660px; height: 660px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.4); }
.txt { right: 64px; white-space: nowrap; transform-origin: 100% 50%; }
#pill { top: 52px; padding: 5px 26px 10px; background: #fff; color: #9B0A10; border-radius: 999px; font-size: 28px; font-weight: 700; }
#h2 { top: 128px; font-size: 56px; font-weight: 600; }
#h3 { top: 188px; font-size: 215px; font-weight: 700; line-height: 1.02; direction: ltr; text-shadow: 0 8px 0 rgba(0,0,0,.18); right: 64px; text-align: right; min-width: 520px; }
#h3 i { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.9) 50%, transparent 62%); mix-blend-mode: overlay; opacity: 0; }
#rib { top: 424px; padding: 8px 40px 14px; background: #008000; border-radius: 14px; font-size: 44px; font-weight: 700; box-shadow: 0 10px 24px rgba(0,0,0,.28); transform-origin: 100% 50%; }
#rib2 { top: 520px; font-size: 30px; font-weight: 600; opacity: .95; }
.card { width: 200px; height: 270px; border: 9px solid #fff; border-radius: 22px; overflow: hidden; background: #e8dccb; box-shadow: 0 22px 44px rgba(60,0,0,.35); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; display: block; }
.card span { position: absolute; bottom: 0; right: 0; left: 0; text-align: center; background: #008000; color: #fff; font-size: 30px; font-weight: 700; padding: 2px 0 7px; }
#c1 { left: 60px; top: 150px; } #c2 { left: 260px; top: 240px; z-index: 2; } #c3 { left: 460px; top: 150px; }
#b56 { left: 575px; top: 70px; width: 118px; height: 118px; border-radius: 50%; background: #008000; border: 6px solid #fff; display: grid; place-items: center; font-size: 56px; font-weight: 700; direction: ltr; z-index: 5; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
#lg { right: 64px; bottom: 26px; width: 84px; height: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
#ft { left: 0; right: 0; bottom: 0; height: 12px; display: flex; direction: ltr; }
#ft i { flex: 1; }
#flash { inset: 0; background: #fff; opacity: 0; z-index: 10; }
</style>
</head>
<body>
<div class="reel">
  <div class="abs" id="lat"></div>
  <div class="abs" id="ring"></div>
  <div class="abs" id="plate"></div>
  <div class="abs flag"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs card" id="c1"><img src="../../../images/categories/mugs.jpg" alt=""><span>مج</span></div>
  <div class="abs card" id="c3"><img src="../../../images/categories/clubs-wallets.jpg" alt=""><span>محفظة</span></div>
  <div class="abs card" id="c2"><img src="../../../images/categories/quotes.jpg" alt=""><span>كوب</span></div>
  <div class="abs" id="b56">56</div>
  <div class="abs txt" id="pill">العيد الوطني العُماني</div>
  <div class="abs txt" id="h2">خصم يصل إلى</div>
  <div class="abs txt" id="h3"><span id="num">40%</span><i></i></div>
  <div class="abs txt" id="rib">على مج وكوب ومحفظة</div>
  <img class="abs" id="lg" src="../../kit/logo_white.png" alt="روا">
  <div class="abs" id="ft"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs" id="flash"></div>
</div>
<script>
window.DURATION = 5;
window.COVER_T = 3.4;
window.render = (t) => {
  const d = A.$("#lat"); d.style.transform = `translate(${-t * 12}px, ${t * 8}px)`;
  A.set("#plate", { o: A.p(t, 0, 0.5), s: 0.85 + 0.15 * A.out(A.p(t, 0, 0.7)) });
  A.rise("#pill", t, 0.15, 0.45, 24);
  A.rise("#h2", t, 0.55, 0.45, 30);
  const k = A.out(A.p(t, 0.8, 1.9));
  document.getElementById("num").textContent = Math.round(40 * k) + "%";
  A.pop("#h3", t, 0.8, 0.5);
  A.set("#h3 i", { o: (t > 1.9 && t < 2.5) ? 1 : 0 });
  document.querySelector("#h3 i").style.transform = `translateX(${(1 - A.p(t, 1.9, 2.5)) * -120}%)`;
  A.rise("#rib", t, 1.7, 0.5, 30);
  ["#c1", "#c3", "#c2"].forEach((s, i) => {
    A.rise(s, t, 1.1 + i * 0.22, 0.6, 140);
    const f = A.p(t, 2.0, 5) * Math.PI * 2;
    A.$(s).style.marginTop = `${Math.sin(f + i) * 6}px`;
  });
  A.pop("#b56", t, 2.2, 0.55, { r: -12 });
  A.rise("#lg", t, 2.8, 0.5, 20);
  A.set("#flash", { o: 0.5 * (1 - A.p(t, 0.8, 1.0)) * A.p(t, 0.75, 0.8) });
};
window.render(0);
</script>
</body>
</html>
