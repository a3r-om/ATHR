<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ريلز: العيد الوطني 56</title>
<link rel="stylesheet" href="../../kit/brand.css">
<script src="../../kit/anim.js"></script>
<style>
.reel { background: radial-gradient(ellipse 1200px 1400px at 50% 35%, #D81E24, #9B0A10 65%, #70060B); color: #fff; font-family: "Plex", sans-serif; overflow: hidden; }
.abs { position: absolute; }
#lat { inset: -80px; opacity: .10; background: repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 60px), repeating-linear-gradient(-45deg, #fff 0 2px, transparent 2px 60px); }
.flag { left: 0; right: 0; display: flex; direction: ltr; }
.flag i { flex: 1; } .w { background: #fff; } .r { background: #DB161B; } .g { background: #008000; }
#pill { top: 150px; left: 0; right: 0; text-align: center; }
#pill span { display: inline-block; padding: 8px 48px 16px; background: #fff; color: #9B0A10; border-radius: 999px; font-size: 56px; font-weight: 700; }
#b56 { top: 270px; left: 50%; margin-left: -110px; width: 220px; height: 220px; border-radius: 50%; background: #008000; border: 12px solid #fff; display: grid; place-items: center; font-size: 110px; font-weight: 700; direction: ltr; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
#h2 { top: 560px; left: 0; right: 0; text-align: center; font-size: 96px; font-weight: 600; }
#h3 { top: 650px; left: 0; right: 0; text-align: center; font-size: 460px; font-weight: 700; line-height: 1; direction: ltr; text-shadow: 0 14px 0 rgba(0,0,0,.18); }
#rib { top: 1130px; left: 0; right: 0; text-align: center; }
#rib span { display: inline-block; padding: 14px 70px 24px; background: #008000; border-radius: 26px; font-size: 76px; font-weight: 700; box-shadow: 0 16px 36px rgba(0,0,0,.3); }
.tiles { top: 1290px; right: 60px; left: 60px; height: 380px; }
.card { top: 0; width: 300px; height: 380px; border: 12px solid #fff; border-radius: 30px; overflow: hidden; background: #e8dccb; box-shadow: 0 26px 50px rgba(60,0,0,.4); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; display: block; }
.card span { position: absolute; bottom: 0; right: 0; left: 0; text-align: center; background: #008000; font-size: 44px; font-weight: 700; padding: 4px 0 10px; }
#k1 { left: 0; } #k2 { left: 330px; } #k3 { left: 660px; }
#lg { left: 50%; margin-left: -65px; bottom: 44px; width: 130px; height: auto; }
</style>
</head>
<body>
<div class="reel">
  <div class="abs" id="lat"></div>
  <div class="abs flag" style="top:0;height:34px"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs flag" style="bottom:0;height:26px"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs" id="pill"><span>العيد الوطني العُماني</span></div>
  <div class="abs" id="b56">56</div>
  <div class="abs" id="h2">خصم يصل إلى</div>
  <div class="abs" id="h3"><span id="num">40%</span></div>
  <div class="abs" id="rib"><span>على مج وكوب ومحفظة</span></div>
  <div class="abs tiles">
    <div class="abs card" id="k1"><img src="../../../images/categories/mugs.jpg" alt=""><span>مج</span></div>
    <div class="abs card" id="k2"><img src="../../../images/categories/quotes.jpg" alt=""><span>كوب</span></div>
    <div class="abs card" id="k3"><img src="../../../images/categories/clubs-wallets.jpg" alt=""><span>محفظة</span></div>
  </div>
  <img class="abs" id="lg" src="../../kit/logo_white.png" alt="روا">
</div>
<script>
window.DURATION = 5;
window.COVER_T = 3.6;
window.render = (t) => {
  A.$("#lat").style.transform = `translate(${-t * 14}px, ${t * 10}px)`;
  A.rise("#pill", t, 0.1, 0.45, 30);
  A.pop("#b56", t, 0.3, 0.55, { r: -12 });
  A.rise("#h2", t, 0.7, 0.45, 40);
  document.getElementById("num").textContent = Math.round(40 * A.out(A.p(t, 0.9, 2.0))) + "%";
  A.pop("#h3", t, 0.9, 0.5);
  A.rise("#rib", t, 1.8, 0.5, 40);
  ["#k1", "#k3", "#k2"].forEach((s, i) => {
    A.rise(s, t, 2.3 + i * 0.2, 0.55, 160);
    A.$(s).style.marginTop = `${Math.sin(A.p(t, 3, 5) * 6.28 + i) * 8}px`;
  });
  A.rise("#lg", t, 3.2, 0.5, 20);
};
window.render(0);
</script>
</body>
</html>
