<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ستوري: العيد الوطني 56 — خصم يصل إلى 40%</title>
<link rel="stylesheet" href="../../kit/brand.css">
<script src="../../kit/anim.js"></script>
<style>
.reel { background: #EFE3CF; color: #570418; font-family: "Plex", sans-serif; overflow: hidden; }
.abs { position: absolute; }
#lat { inset: -80px; opacity: .13; background: repeating-linear-gradient(45deg, #570418 0 2px, transparent 2px 64px), repeating-linear-gradient(-45deg, #570418 0 2px, transparent 2px 64px); }
.flag { left: 0; right: 0; height: 22px; display: flex; direction: ltr; z-index: 9; }
.flag i { flex: 1; } .w { background: #fff; } .r { background: #DB161B; } .g { background: #008000; }
.c { left: 0; right: 0; text-align: center; }
#pill { top: 280px; } #pill span { display: inline-block; border: 4px solid #570418; border-radius: 999px; padding: 6px 50px 14px; font-size: 52px; font-weight: 700; } #pill b { color: #B3261E; }
#h2 { top: 420px; font-size: 100px; font-weight: 600; }
#h3 { top: 510px; font-size: 440px; font-weight: 700; line-height: 1; direction: ltr; }
#sub { top: 990px; font-size: 68px; font-weight: 700; }
.card { width: 300px; height: 380px; border: 12px solid #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 24px 46px rgba(87,4,24,.28); background: #e8dccb; top: 1120px; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
#k1 { left: 90px; } #k2 { left: 390px; z-index: 2; margin-top: 40px; } #k3 { left: 690px; }
.bd { width: 150px; height: 150px; border-radius: 50%; background: #D6DB89; color: #570418; display: grid; place-content: center; text-align: center; font-weight: 700; line-height: 1; box-shadow: 0 12px 24px rgba(87,4,24,.25); top: 1075px; z-index: 5; }
.bd small { font-size: 34px; display: block; } .bd b { font-size: 62px; direction: ltr; display: block; }
#bd1 { left: 70px; } #bd2 { left: 560px; top: 1160px; } #bd3 { left: 860px; }
#lg { left: 50%; margin-left: -80px; top: 1560px; width: 160px; height: auto; }
</style>
</head>
<body>
<div class="reel">
  <div class="abs" id="lat"></div>
  <div class="abs flag" style="top:0"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs flag" style="bottom:0"><i class="w"></i><i class="r"></i><i class="g"></i></div>
  <div class="abs c" id="pill"><span>العيد الوطني العُماني <b>56</b></span></div>
  <div class="abs c" id="h2">خصم يصل إلى</div>
  <div class="abs c" id="h3"><span id="num">40%</span></div>
  <div class="abs c" id="sub">على مج وكوب ومحفظة · عُمان</div>
  <div class="abs card" id="k1"><img src="img/mug.jpg" style="object-position:50% 62%" alt=""></div>
  <div class="abs card" id="k2"><img src="img/cup.jpg" style="object-position:50% 62%" alt=""></div>
  <div class="abs card" id="k3"><img src="img/wallet.jpg" style="transform:scale(1.5)" alt=""></div>
  <div class="abs bd" id="bd1"><small>خصم</small><b>40%</b></div>
  <div class="abs bd" id="bd3"><small>خصم</small><b>40%</b></div>
  <img class="abs" id="lg" src="../../kit/logo_burgundy.png" alt="روا">
</div>
<script>
window.DURATION = 5;
window.COVER_T = 3.6;
const rot = { "#k1": -5, "#k2": 3, "#k3": 5 };
window.render = (t) => {
  A.$("#lat").style.transform = `translate(${-t * 14}px, ${t * 10}px)`;
  A.rise("#pill", t, 0.1, 0.45, 30);
  A.rise("#h2", t, 0.4, 0.45, 40);
  document.getElementById("num").textContent = Math.round(40 * A.out(A.p(t, 0.6, 1.7))) + "%";
  A.pop("#h3", t, 0.6, 0.5);
  A.rise("#sub", t, 1.5, 0.45, 40);
  ["#k1", "#k2", "#k3"].forEach((s, i) => {
    const k = A.out(A.p(t, 2.0 + i * 0.22, 2.7 + i * 0.22));
    const fl = Math.sin(A.p(t, 3, 5) * 6.28 + i) * 8;
    const el = A.$(s);
    el.style.opacity = Math.min(1, k * 3);
    el.style.transform = `translateY(${(1 - k) * 160 + fl}px) rotate(${rot[s] * k}deg)`;
  });
  A.pop("#bd1", t, 2.9, 0.45, { r: -10 });
  A.pop("#bd3", t, 3.1, 0.45, { r: 10 });
  A.rise("#lg", t, 3.4, 0.5, 20);
};
window.render(0);
</script>
</body>
</html>
