<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="{{MODE}}" class="{{HTML_CLASS}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
{{HEAD}}
<meta name="theme-color" content="{{THEME_COLOR}}">
<link rel="icon" href="{{BASE}}images/logo2.jpeg">
<link rel="apple-touch-icon" href="{{BASE}}images/logo2.jpeg">
<link rel="preconnect" href="{{API_ORIGIN}}" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet" href="{{FONT_HREF}}" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="{{FONT_HREF}}"></noscript>
<link rel="stylesheet" href="{{BASE}}css/store.css?v={{V_CSS}}">
<style id="themeVars">{{THEME_CSS}}</style>
<script>window.ATHR_BASE = "{{BASE}}";
(function () { var d = document.documentElement; try { var m = JSON.parse(localStorage.getItem("athr_mode")); if (m === "light" || m === "dark" || m === "auto") d.setAttribute("data-mode", m); } catch (e) {} try { if (JSON.parse(localStorage.getItem("athr_lang")) === "en") { d.lang = "en"; d.dir = "ltr"; d.classList.add("i18n-wait"); setTimeout(function () { d.classList.remove("i18n-wait"); }, 2500); } } catch (e) {} })();</script>
</head>
<body>

<a class="skip-link" href="#view">انتقل إلى المحتوى</a>

<header class="top" id="top">
    <div class="top-row{{TOPROW_CLASS}}">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="القائمة" aria-haspopup="dialog"{{MENU_HIDDEN}}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <a class="brand" href="{{BASE}}" id="brand" aria-label="{{STORE_NAME}} — الرئيسية">{{BRAND}}</a>
        <form class="search" id="searchBox" role="search" action="{{BASE}}search/"{{SEARCH_HIDDEN}}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="searchInput" name="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="{{SEARCH_PLACEHOLDER}}" aria-label="بحث في المنتجات">
        </form>
        <button class="lang-btn" id="langBtn" type="button" lang="en" aria-label="Switch to English">EN</button>
        <button class="cur-btn" id="curBtn" type="button" aria-label="الدولة والعملة"{{CUR_HIDDEN}}><span id="curFlag" aria-hidden="true">{{CUR_FLAG}}</span><span id="curSym">{{CUR_SYM}}</span></button>
        <a class="icon-btn cart-btn" href="{{BASE}}cart/" aria-label="السلة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
            <span class="cart-count" id="cartCount" hidden>0</span>
        </a>
    </div>
</header>

<div id="bars" class="bars">{{BARS}}</div>

<main id="view" tabindex="-1" data-route="{{ROUTE}}"{{VIEW_ATTRS}}>
{{VIEW}}
</main>

<footer id="footer" class="footer">{{FOOTER}}</footer>

<a id="waFloat" class="wa-float{{WA_CLASS}}" {{WA_ATTRS}} target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6a9.3 9.3 0 0 0-8 14.1L2.7 21.4l4.8-1.3A9.3 9.3 0 1 0 12 2.6Z"/><path class="wa-glyph" d="M8.4 7.6c.2-.4.4-.4.7-.4h.6c.2 0 .4.1.5.4l.8 1.8c.1.3.1.5-.1.7l-.7.8c.7 1.3 1.7 2.3 3 3l.8-.7c.2-.2.4-.2.7-.1l1.8.8c.3.1.4.3.4.5v.6c0 .3-.1.5-.4.7-.4.3-1 .5-1.6.5-1.4 0-3.2-.8-4.7-2.3S8 9.9 8 8.5c0-.4.1-.7.4-.9Z"/></svg>
</a>

<div id="buyBar" class="buybar" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="{{BASE}}js/supabase-config.js?v={{V_CFG}}" defer></script>
<script src="{{BASE}}js/defaults.js?v={{V_DEF}}" defer></script>
<script src="{{BASE}}js/views.js?v={{V_VIEWS}}" defer></script>
<script src="{{BASE}}js/i18n-en.js?v={{V_I18N}}" defer></script>
<script src="{{BASE}}js/thumbs.js?v={{V_THUMBS}}" defer></script>
<script src="{{BASE}}js/rates.js?v={{V_RATES}}" defer></script>
<script src="{{BASE}}js/store.js?v={{V_STORE}}" defer></script>
</body>
</html>
